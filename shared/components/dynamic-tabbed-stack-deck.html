<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>动态标签页堆叠卡片（Tabbed Stack Deck）— shared 组件</title>

<!--
  组件：动态标签页堆叠卡片
  用途：多标签页 + 卡片内容的切换展示（知识卡片分类、对比讲解等）
  实现：纯 CSS（radio :checked 状态机），零 JavaScript 依赖
  前缀：tsd-（Tabbed Stack Deck），多课复制时避免与其它组件冲突
  颜色：oklch 为主色，内置 --cf 十六进制降级，兼容旧浏览器
-->
<style>
.tsd,
.tsd *,
.tsd *::before,
.tsd *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.tsd {
  font-family: 'Segoe UI',system-ui,sans-serif;
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  background: #20222c;
}

.tsd__deck {
  position: relative;
  width: min(400px,100%);
  height: 300px;
  padding-top: 44px;
}

.tsd__r {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

.tsd__tab {
  position: absolute;
  top: 0;
  left: calc(var(--l) * 25%);
  width: 24%;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: var(--cf, #888);
  background: var(--c);
  border-radius: 12px 12px 0 0;
  cursor: pointer;
  z-index: 5;
  filter: brightness(.8);
  transition: filter .25s,transform .25s;
}

.tsd__tab:hover {
  filter: brightness(.95);
}

.tsd__card {
  position: absolute;
  left: 0;
  right: 0;
  top: 40px;
  height: 250px;
  padding: 28px;
  border-radius: 0 16px 16px 16px;
  color: #fff;
  background: var(--cf, #888);
  background: var(--c);
  box-shadow: 0 26px 50px -28px rgba(0,0,0,.7);
  transform: translateY(24px) scale(.94);
  transition: transform .45s cubic-bezier(.3,.9,.3,1);
  z-index: 1;
}

.tsd__card h3 {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 12px;
  letter-spacing: -.02em;
}

.tsd__card p {
  font-size: 15px;
  line-height: 1.6;
  max-width: 34ch;
  opacity: .95;
}

.tsd__r:nth-of-type(1):checked ~ .tsd__tab:nth-of-type(1),
.tsd__r:nth-of-type(2):checked ~ .tsd__tab:nth-of-type(2),
.tsd__r:nth-of-type(3):checked ~ .tsd__tab:nth-of-type(3),
.tsd__r:nth-of-type(4):checked ~ .tsd__tab:nth-of-type(4) {
  filter: brightness(1);
  transform: translateY(-4px);
}

.tsd__r:nth-of-type(1):checked ~ .tsd__card:nth-of-type(1),
.tsd__r:nth-of-type(2):checked ~ .tsd__card:nth-of-type(2),
.tsd__r:nth-of-type(3):checked ~ .tsd__card:nth-of-type(3),
.tsd__r:nth-of-type(4):checked ~ .tsd__card:nth-of-type(4) {
  transform: translateY(0) scale(1);
  z-index: 4;
}

.tsd__r:focus-visible ~ .tsd__tab {
  outline: 3px solid #fff;
  outline-offset: 2px;
}

.tsd__r:nth-of-type(1):focus-visible ~ .tsd__tab:nth-of-type(1),
.tsd__r:nth-of-type(2):focus-visible ~ .tsd__tab:nth-of-type(2),
.tsd__r:nth-of-type(3):focus-visible ~ .tsd__tab:nth-of-type(3),
.tsd__r:nth-of-type(4):focus-visible ~ .tsd__tab:nth-of-type(4) {
  outline: 3px solid #fff;
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  .tsd__tab,
  .tsd__card {
    transition: none;
  }
}
</style>
</head>
<body>
<section class="tsd" aria-label="标签页卡片组">
  <div class="tsd__deck">
    <input type="radio" name="tsd" id="tsd-1" class="tsd__r" checked>
    <input type="radio" name="tsd" id="tsd-2" class="tsd__r">
    <input type="radio" name="tsd" id="tsd-3" class="tsd__r">
    <input type="radio" name="tsd" id="tsd-4" class="tsd__r">
    <label class="tsd__tab" for="tsd-1" style="--c:oklch(0.65 0.17 25);--cf:#cf5f52;--l:0">概览</label>
    <label class="tsd__tab" for="tsd-2" style="--c:oklch(0.7 0.16 145);--cf:#52a15a;--l:1">特性</label>
    <label class="tsd__tab" for="tsd-3" style="--c:oklch(0.68 0.15 235);--cf:#4f8fc7;--l:2">用法</label>
    <label class="tsd__tab" for="tsd-4" style="--c:oklch(0.68 0.16 300);--cf:#a055b8;--l:3">兼容</label>
    <article class="tsd__card" style="--c:oklch(0.65 0.17 25);--cf:#cf5f52"><h3>概览</h3><p>一组标签页，四张卡片。点击标签，对应卡片会带到最前面。</p></article>
    <article class="tsd__card" style="--c:oklch(0.7 0.16 145);--cf:#52a15a"><h3>特性</h3><p>纯 CSS 实现，零 JavaScript 依赖，复制即用，适合课堂快速搭建。</p></article>
    <article class="tsd__card" style="--c:oklch(0.68 0.15 235);--cf:#4f8fc7"><h3>用法</h3><p>整页 iframe 嵌入，或抽取片段复制进课程页面，替换内容即可。</p></article>
    <article class="tsd__card" style="--c:oklch(0.68 0.16 300);--cf:#a055b8"><h3>兼容</h3><p>oklch 主色内置十六进制降级，旧浏览器自动回退，交互不受影响。</p></article>
  </div>
</section>
<script>/* 无 JavaScript：radio :checked 状态机把选中卡片拉到最前，其余卡片后退露出各自标签。 */</script>
</body>
</html>
