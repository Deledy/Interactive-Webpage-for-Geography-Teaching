<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Lightbox / 图片查看器</title>
<style>
/* ============================================================
   Image Lightbox — 共享图片查看器组件
   命名前缀 .ilb  使用方式见文末 usage guide
   ============================================================ */

/* ---------- CSS Custom Properties (可覆写以匹配主题) ---------- */
:root {
  --ilb-overlay-bg: rgba(5, 6, 16, 0.72);
  --ilb-overlay-blur: 6px;
  --ilb-panel-bg: #141a38;
  --ilb-panel-radius: 16px;
  --ilb-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
  --ilb-accent: #FFD54F;
  --ilb-accent-2: #4FC3F7;
  --ilb-text: #E8EAF6;
  --ilb-text-dim: rgba(232, 234, 246, 0.7);
  --ilb-ctrl-bg: rgba(255, 255, 255, 0.08);
  --ilb-ctrl-border: rgba(255, 255, 255, 0.14);
  --ilb-ctrl-hover-bg: rgba(255, 255, 255, 0.14);
  --ilb-ctrl-size: 44px;
  --ilb-ease: cubic-bezier(0.25, 0.8, 0.35, 1);
  --ilb-dur: 0.35s;
  --ilb-z: 1000;

  /* 预注册自定义属性用于平滑缩放过渡 (Chromium only, 不支持的浏览器平滑失效而是直接到位) */
  --ilb-zoom: 1;
  --ilb-pan-x: 0px;
  --ilb-pan-y: 0px;
}

/* ---------- Overlay ---------- */
.ilb-overlay {
  position: fixed;
  inset: 0;
  z-index: var(--ilb-z);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--ilb-overlay-bg);
  backdrop-filter: blur(var(--ilb-overlay-blur));
  -webkit-backdrop-filter: blur(var(--ilb-overlay-blur));
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--ilb-dur) var(--ilb-ease), visibility 0s var(--ilb-dur);
}

.ilb-overlay.is-open {
  opacity: 1;
  visibility: visible;
  transition: opacity var(--ilb-dur) var(--ilb-ease), visibility 0s 0s;
}

/* ---------- Panel ---------- */
.ilb-panel {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: min(90vw, 1200px);
  max-height: 90vh;
  background: var(--ilb-panel-bg);
  border-radius: var(--ilb-panel-radius);
  box-shadow: var(--ilb-shadow);
  overflow: hidden;
  transform: scale(0.92) translateY(12px);
  transition: transform var(--ilb-dur) var(--ilb-ease);
}

.ilb-overlay.is-open .ilb-panel {
  transform: scale(1) translateY(0);
}

/* ---------- Image viewport ---------- */
.ilb-viewport {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: grab;
  min-height: 200px;
  min-width: 300px;
}

.ilb-viewport.is-dragging {
  cursor: grabbing;
}

.ilb-viewport.is-dragging .ilb-img {
  transition: none;
}

.ilb-img {
  display: block;
  max-width: 100%;
  max-height: 70vh;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  transform: translate(var(--ilb-pan-x), var(--ilb-pan-y)) scale(var(--ilb-zoom));
  transform-origin: center center;
  transition: transform 0.25s var(--ilb-ease);
  will-change: transform;
}

/* ---------- Close button ---------- */
.ilb-close {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 10;
  width: var(--ilb-ctrl-size);
  height: var(--ilb-ctrl-size);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.35);
  color: var(--ilb-text-dim);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  transition:
    color var(--ilb-dur) var(--ilb-ease),
    background var(--ilb-dur) var(--ilb-ease),
    box-shadow var(--ilb-dur) var(--ilb-ease);
}

.ilb-close:hover,
.ilb-close:focus-visible {
  color: var(--ilb-accent);
  background: rgba(255, 213, 79, 0.15);
  box-shadow: 0 0 16px rgba(255, 213, 79, 0.3);
  outline: none;
}

/* ---------- Toolbar (缩放控制) ---------- */
.ilb-toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  background: var(--ilb-panel-bg);
  border-top: 1px solid var(--ilb-ctrl-border);
  width: 100%;
  justify-content: center;
}

.ilb-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--ilb-ctrl-size);
  height: var(--ilb-ctrl-size);
  border: 1px solid var(--ilb-ctrl-border);
  border-radius: 50%;
  background: var(--ilb-ctrl-bg);
  color: var(--ilb-text-dim);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  transition:
    color var(--ilb-dur) var(--ilb-ease),
    background var(--ilb-dur) var(--ilb-ease),
    border-color var(--ilb-dur) var(--ilb-ease),
    box-shadow var(--ilb-dur) var(--ilb-ease);
  user-select: none;
}

.ilb-btn:hover,
.ilb-btn:focus-visible {
  color: var(--ilb-accent-2);
  background: var(--ilb-ctrl-hover-bg);
  border-color: var(--ilb-accent-2);
  box-shadow: 0 0 12px rgba(79, 195, 247, 0.25);
  outline: none;
}

.ilb-btn:active {
  transform: scale(0.94);
}

.ilb-btn--reset {
  width: auto;
  min-width: 52px;
  padding: 0 12px;
  border-radius: 22px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.3px;
}

.ilb-btn--reset:hover,
.ilb-btn--reset:focus-visible {
  color: var(--ilb-accent);
  border-color: var(--ilb-accent);
  box-shadow: 0 0 12px rgba(255, 213, 79, 0.3);
}

/* ---------- Loading spinner ---------- */
.ilb-spinner {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
}

.ilb-spinner.is-active {
  opacity: 1;
}

.ilb-spinner::after {
  content: '';
  width: 32px;
  height: 32px;
  border: 3px solid var(--ilb-ctrl-border);
  border-top-color: var(--ilb-accent-2);
  border-radius: 50%;
  animation: ilb-spin 0.7s linear infinite;
}

@keyframes ilb-spin {
  to { transform: rotate(360deg); }
}

/* ---------- 键盘快捷键提示 ---------- */
.ilb-hint {
  position: absolute;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  padding: 5px 14px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.55);
  color: var(--ilb-text-dim);
  font-size: 12px;
  letter-spacing: 0.3px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}

.ilb-overlay.is-open .ilb-hint {
  opacity: 1;
  transition: opacity 0.6s 0.8s;
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  .ilb-overlay,
  .ilb-panel,
  .ilb-img,
  .ilb-close,
  .ilb-btn,
  .ilb-spinner,
  .ilb-hint {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>
<body>

<!-- ========== Lightbox HTML (通过 JS 动态注入，此处为模板参考) ========== -->
<template id="ilb-template">
  <div class="ilb-overlay" role="dialog" aria-modal="true" aria-label="图片查看器">
    <div class="ilb-panel">
      <button class="ilb-close" aria-label="关闭" title="关闭 (Esc)">✕</button>
      <div class="ilb-viewport">
        <div class="ilb-spinner"></div>
        <img class="ilb-img" src="" alt="">
      </div>
      <div class="ilb-toolbar">
        <button class="ilb-btn ilb-btn--zoom-out" aria-label="缩小" title="缩小 (−)">−</button>
        <button class="ilb-btn ilb-btn--reset" aria-label="重置缩放" title="重置缩放">100%</button>
        <button class="ilb-btn ilb-btn--zoom-in" aria-label="放大" title="放大 (+)">+</button>
      </div>
      <div class="ilb-hint">滚轮缩放 · 拖拽平移 · Esc 关闭</div>
    </div>
  </div>
</template>

<script>
/* ============================================================
   ImageLightbox — 零依赖、可复用的图片查看器
   ============================================================
   使用方式:
   1. 在页面中引入本文件（iframe 或复制 script 段）
   2. 给需要点击放大的图片添加 data-lightbox 属性：
      <img src="photo.jpg" data-lightbox alt="描述">
   3. 或通过 JS API 手动调用：
      ImageLightbox.open('photo.jpg', '描述文字');
   ============================================================ */

(function () {
  'use strict';

  /* ---- Configuration ---- */
  const CFG = {
    attr: 'data-lightbox',        // 触发属性
    zoomStep: 0.25,                // 每次按钮缩放步长
    zoomMin: 0.3,                  // 最小缩放
    zoomMax: 5,                    // 最大缩放
    wheelZoomSpeed: 0.1,           // 滚轮缩放灵敏度
    dbClickThreshold: 300,         // 双击最大间隔 (ms)
    initialZoom: 1,
    initialPanX: 0,
    initialPanY: 0,
  };

  /* ---- 检测运行环境 ---- */
  const isInIframe = (function () {
    try { return window.self !== window.top; } catch (e) { return true; }
  })();

  // 目标文档：iframe 模式下操作父文档，否则操作当前文档
  const targetDoc = isInIframe ? window.parent.document : document;
  const targetWin = isInIframe ? window.parent : window;

  /* ---- DOM refs（动态注入后填充） ---- */
  let overlay, panel, viewport, img, spinner, btnZoomIn, btnZoomOut, btnReset, btnClose, labelZoom;
  let zoom    = CFG.initialZoom;
  let panX    = CFG.initialPanX;
  let panY    = CFG.initialPanY;

  /* ---- 拖拽状态 ---- */
  let isDragging    = false;
  let dragStartX    = 0;
  let dragStartY    = 0;
  let dragPanX      = 0;
  let dragPanY      = 0;

  /* ---- 动画帧节流 ---- */
  let rafPending = false;

  /* ---- 双击检测 ---- */
  let lastClickTime = 0;

  /* ---- 初始化：注入 DOM ---- */
  function init() {
    if (overlay) return; // 已初始化

    // 注入样式到目标文档（仅 iframe 模式下需要，直接嵌入时页面已含样式）
    if (isInIframe) {
      injectStyles();
    }

    // 查找模板来源：iframe 模式用当前文档，直接嵌入用目标文档
    const tplSource = isInIframe ? document : targetDoc;
    const tpl = tplSource.getElementById('ilb-template');
    if (!tpl) return;

    const fragment = tpl.content.cloneNode(true);
    targetDoc.body.appendChild(fragment);

    // 获取引用
    overlay    = targetDoc.querySelector('.ilb-overlay');
    panel      = overlay.querySelector('.ilb-panel');
    viewport   = overlay.querySelector('.ilb-viewport');
    img        = overlay.querySelector('.ilb-img');
    spinner    = overlay.querySelector('.ilb-spinner');
    btnZoomIn  = overlay.querySelector('.ilb-btn--zoom-in');
    btnZoomOut = overlay.querySelector('.ilb-btn--zoom-out');
    btnReset   = overlay.querySelector('.ilb-btn--reset');
    btnClose   = overlay.querySelector('.ilb-close');
    labelZoom  = btnReset;

    bindEvents();
    bindTrigger();
  }

  /* ---- 注入样式到目标文档（iframe 模式用） ---- */
  function injectStyles() {
    if (targetDoc.getElementById('ilb-injected-styles')) return;

    // 收集当前文档中所有 .ilb 相关样式
    const ownStyles = document.querySelectorAll('style');
    let cssText = '';
    ownStyles.forEach(function (s) {
      cssText += s.textContent;
    });

    const styleEl = targetDoc.createElement('style');
    styleEl.id = 'ilb-injected-styles';
    styleEl.textContent = cssText;
    targetDoc.head.appendChild(styleEl);
  }

  /* ---- 事件绑定 ---- */
  function bindEvents() {
    // 关闭
    btnClose.addEventListener('click', close);
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) close();
    });

    // 缩放按钮
    btnZoomIn.addEventListener('click', function () { applyZoom(zoom + CFG.zoomStep); });
    btnZoomOut.addEventListener('click', function () { applyZoom(zoom - CFG.zoomStep); });
    btnReset.addEventListener('click', reset);

    // 滚轮缩放
    viewport.addEventListener('wheel', onWheel, { passive: false });

    // 拖拽平移
    viewport.addEventListener('pointerdown', onPointerDown);
    targetWin.addEventListener('pointermove', onPointerMove);
    targetWin.addEventListener('pointerup', onPointerUp);

    // 双击缩放切换
    viewport.addEventListener('click', onViewportClick);

    // 图片加载
    img.addEventListener('load', onImgLoad);
    img.addEventListener('error', onImgError);

    // 键盘
    targetDoc.addEventListener('keydown', onKeyDown);

    // 触摸手势（双指缩放）
    viewport.addEventListener('touchstart', onTouchStart, { passive: false });
    viewport.addEventListener('touchmove', onTouchMove, { passive: false });
    viewport.addEventListener('touchend', onTouchEnd);
  }

  /* ---- 全局图片点击代理 ---- */
  function bindTrigger() {
    targetDoc.addEventListener('click', function (e) {
      const target = e.target.closest('[' + CFG.attr + ']');
      if (!target) return;

      // 如果点击的是已打开 lightbox 内的图片则不触发
      if (target.closest('.ilb-overlay')) return;

      e.preventDefault();
      const src = target.getAttribute('src') || target.getAttribute('href') || target.getAttribute(CFG.attr);
      const alt = target.getAttribute('alt') || '';
      if (src && src !== '#') open(src, alt);
    });
  }

  /* ---- 打开 ---- */
  function open(src, alt) {
    init();
    if (!overlay) return;

    // 阻止页面滚动
    targetDoc.body.style.overflow = 'hidden';

    // 重置状态
    zoom = CFG.initialZoom;
    panX = CFG.initialPanX;
    panY = CFG.initialPanY;

    // 显示加载
    spinner.classList.add('is-active');
    img.style.opacity = '0';

    // 设图
    img.src = src;
    img.alt = alt || '';

    applyTransform();
    updateLabel();

    // 开启动画
    overlay.classList.add('is-open');

    // 焦点管理
    btnClose.focus();
  }

  /* ---- 关闭 ---- */
  function close() {
    if (!overlay) return;

    overlay.classList.remove('is-open');
    targetDoc.body.style.overflow = '';

    // 动画结束后清理（防止内存泄漏）
    setTimeout(function () {
      if (!overlay.classList.contains('is-open')) {
        img.src = '';
      }
    }, 400);
  }

  /* ---- 重置 ---- */
  function reset() {
    zoom = CFG.initialZoom;
    panX = CFG.initialPanX;
    panY = CFG.initialPanY;
    applyTransform();
    updateLabel();
  }

  /* ---- 缩放 ---- */
  function applyZoom(newZoom, cx, cy) {
    const oldZoom = zoom;
    zoom = clamp(newZoom, CFG.zoomMin, CFG.zoomMax);

    // 以点 (cx, cy) 为中心缩放（cx/cy 为视口内坐标，0-1 比例）
    if (cx !== undefined && cy !== undefined && oldZoom !== zoom) {
      const viewportW = viewport.clientWidth;
      const viewportH = viewport.clientHeight;

      // 当前点在图片坐标系中的位置
      const imgX = (cx * viewportW - panX) / oldZoom;
      const imgY = (cy * viewportH - panY) / oldZoom;

      // 新缩放后，调整偏移使该点保持在视口同一位置
      panX = cx * viewportW - imgX * zoom;
      panY = cy * viewportH - imgY * zoom;
    }

    applyTransform();
    updateLabel();
  }

  function clamp(v, min, max) {
    return Math.min(max, Math.max(min, v));
  }

  /* ---- 应用变换 ---- */
  function applyTransform() {
    if (!img) return;
    img.style.setProperty('--ilb-zoom', zoom);
    img.style.setProperty('--ilb-pan-x', panX + 'px');
    img.style.setProperty('--ilb-pan-y', panY + 'px');

    // 回退：对不支持 @property 的浏览器直接写 transform
    img.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + zoom + ')';
  }

  function updateLabel() {
    if (!labelZoom) return;
    labelZoom.textContent = Math.round(zoom * 100) + '%';
  }

  /* ---- 滚轮事件 ---- */
  function onWheel(e) {
    e.preventDefault();

    const rect = viewport.getBoundingClientRect();
    const cx = (e.clientX - rect.left) / rect.width;
    const cy = (e.clientY - rect.top) / rect.height;

    const delta = e.deltaY > 0 ? -CFG.wheelZoomSpeed : CFG.wheelZoomSpeed;
    applyZoom(zoom + delta, cx, cy);
  }

  /* ---- 拖拽平移 ---- */
  function onPointerDown(e) {
    if (e.pointerType === 'touch') return; // 触屏走 touch 事件
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragPanX = panX;
    dragPanY = panY;
    viewport.classList.add('is-dragging');
    viewport.setPointerCapture(e.pointerId);
  }

  function onPointerMove(e) {
    if (!isDragging) return;
    panX = dragPanX + (e.clientX - dragStartX);
    panY = dragPanY + (e.clientY - dragStartY);
    scheduleApply();
  }

  function onPointerUp(e) {
    if (!isDragging) return;
    isDragging = false;
    viewport.classList.remove('is-dragging');
    viewport.releasePointerCapture(e.pointerId);
  }

  function scheduleApply() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      applyTransform();
      rafPending = false;
    });
  }

  /* ---- 双击缩放 ---- */
  function onViewportClick(e) {
    // 拖拽后不应触发双击
    if (Math.abs(panX - dragPanX) > 2 || Math.abs(panY - dragPanY) > 2) return;

    const now = Date.now();
    if (now - lastClickTime < CFG.dbClickThreshold) {
      // 双击：在 1x 和 2x 之间切换
      if (zoom < 1.5) {
        const rect = viewport.getBoundingClientRect();
        const cx = (e.clientX - rect.left) / rect.width;
        const cy = (e.clientY - rect.top) / rect.height;
        applyZoom(2, cx, cy);
      } else {
        reset();
      }
    }
    lastClickTime = now;
  }

  /* ---- 触屏手势 ---- */
  let touchStartDist = 0;
  let touchStartZoom = 1;
  let touchStartMidX = 0;
  let touchStartMidY = 0;
  let touchStartPanX = 0;
  let touchStartPanY = 0;
  let touchCount = 0;

  function onTouchStart(e) {
    touchCount = e.touches.length;
    if (touchCount === 1) {
      isDragging = true;
      dragStartX = e.touches[0].clientX;
      dragStartY = e.touches[0].clientY;
      dragPanX = panX;
      dragPanY = panY;
      viewport.classList.add('is-dragging');
    } else if (touchCount === 2) {
      isDragging = false;
      viewport.classList.remove('is-dragging');
      const t0 = e.touches[0];
      const t1 = e.touches[1];
      touchStartDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
      touchStartZoom = zoom;
      touchStartMidX = (t0.clientX + t1.clientX) / 2;
      touchStartMidY = (t0.clientY + t1.clientY) / 2;
      touchStartPanX = panX;
      touchStartPanY = panY;
    }
  }

  function onTouchMove(e) {
    if (e.touches.length === 1 && isDragging) {
      e.preventDefault();
      panX = dragPanX + (e.touches[0].clientX - dragStartX);
      panY = dragPanY + (e.touches[0].clientY - dragStartY);
      scheduleApply();
    } else if (e.touches.length === 2) {
      e.preventDefault();
      const t0 = e.touches[0];
      const t1 = e.touches[1];
      const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
      const midX = (t0.clientX + t1.clientX) / 2;
      const midY = (t0.clientY + t1.clientY) / 2;

      // 缩放
      const newZoom = clamp(touchStartZoom * (dist / touchStartDist), CFG.zoomMin, CFG.zoomMax);

      // 以双指中点为中心缩放
      const rect = viewport.getBoundingClientRect();
      const vpW = rect.width;
      const vpH = rect.height;

      const cx = (touchStartMidX - rect.left) / vpW;
      const cy = (touchStartMidY - rect.top) / vpH;

      const imgX = (cx * vpW - panX) / zoom;
      const imgY = (cy * vpH - panY) / zoom;

      zoom = newZoom;
      panX = cx * vpW - imgX * zoom;
      panY = cy * vpH - imgY * zoom;

      // 平移
      panX = touchStartPanX + (midX - touchStartMidX);
      panY = touchStartPanY + (midY - touchStartMidY);

      applyTransform();
      updateLabel();
    }
  }

  function onTouchEnd(e) {
    isDragging = false;
    viewport.classList.remove('is-dragging');
    touchCount = e.touches.length;
  }

  /* ---- 键盘 ---- */
  function onKeyDown(e) {
    if (!overlay || !overlay.classList.contains('is-open')) return;

    switch (e.key) {
      case 'Escape':
        e.preventDefault();
        close();
        break;
      case '+':
      case '=':
        e.preventDefault();
        applyZoom(zoom + CFG.zoomStep);
        break;
      case '-':
        e.preventDefault();
        applyZoom(zoom - CFG.zoomStep);
        break;
      case '0':
        e.preventDefault();
        reset();
        break;
    }
  }

  /* ---- 图片加载 ---- */
  function onImgLoad() {
    spinner.classList.remove('is-active');
    img.style.opacity = '1';
    img.style.transition = 'opacity 0.25s, transform 0.25s var(--ilb-ease)';
  }

  function onImgError() {
    spinner.classList.remove('is-active');
    img.style.opacity = '1';
    img.alt = '图片加载失败';
  }

  /* ---- 启动 ---- */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  /* ---- 公开 API ---- */
  window.ImageLightbox = {
    open: open,
    close: close,
    reset: reset,
  };

  // iframe 模式下，同时暴露 API 到父窗口方便手动调用
  if (isInIframe) {
    targetWin.ImageLightbox = targetWin.ImageLightbox || window.ImageLightbox;
  }
})();
</script>
