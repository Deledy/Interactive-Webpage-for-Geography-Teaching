<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>练习编辑器 · 地理教学网页</title>
<style>
  :root {
    --bg: #0b1026;
    --panel: #121a38;
    --panel-2: #0e1430;
    --line: rgba(148,163,184,0.28);
    --gold: #ffd54f;
    --cyan: #4fc3f7;
    --blue: #64b5f6;
    --success: #66bb6a;
    --error: #ef5350;
    --text: #e8eaf6;
    --dim: rgba(232,234,246,0.66);
    --radius: 10px;
    --font: "Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.6;
  }
  header.bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px;
    background: rgba(11,16,38,0.92);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(8px);
  }
  header.bar h1 { margin: 0 8px 0 0; font-size: 18px; letter-spacing: 1px; }
  header.bar .grow { flex: 1; }
  .badge { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--dim); }
  .btn {
    padding: 8px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--blue); background: rgba(100,181,246,0.14);
    color: var(--blue); font-size: 14px; font-family: inherit;
    transition: background .2s, transform .1s;
  }
  .btn:hover { background: rgba(100,181,246,0.26); }
  .btn:active { transform: scale(.98); }
  .btn--primary { background: var(--blue); color: #06122b; font-weight: 700; }
  .btn--ghost { border-color: var(--line); background: transparent; color: var(--text); }
  .btn--danger { border-color: var(--error); color: var(--error); background: rgba(239,83,80,0.1); }
  .btn--sm { padding: 5px 10px; font-size: 13px; }

  main { display: grid; grid-template-columns: 232px minmax(0,1fr) minmax(0,1fr); gap: 0; min-height: calc(100vh - 60px); }
  .col { padding: 18px 20px; overflow: auto; }
  .col--tree { border-right: 1px solid var(--line); background: var(--panel-2); padding: 14px 12px; }
  .col--edit { border-right: 1px solid var(--line); }
  .col--preview { background: var(--panel-2); }
  .col--tree.is-drop { outline: 2px dashed var(--blue); outline-offset: -6px; }
  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr; }
    .col--tree, .col--edit { border-right: none; border-bottom: 1px solid var(--line); }
  }

  /* 左侧模块树 */
  .rail__title { margin: 0 0 10px; font-size: 12px; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; }
  .tree__item {
    display: block; width: 100%; text-align: left; padding: 8px 10px; margin-bottom: 4px;
    border: 1px solid transparent; border-radius: 8px; background: transparent;
    color: var(--text); font-family: inherit; font-size: 13px; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .tree__item:hover { background: rgba(100,181,246,.1); }
  .tree__item.is-active { background: rgba(100,181,246,.18); border-color: var(--blue); }
  .tree__item.is-dim { opacity: .62; }
  .tree__line { display: flex; gap: 6px; align-items: baseline; }
  .tree__no { color: var(--dim); flex: 0 0 auto; }
  .tree__name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree__meta { display: block; margin-top: 2px; font-size: 12px; color: var(--dim); }
  .tree__meta.is-empty { color: var(--gold); }

  .meta-grid { display: grid; grid-template-columns: 160px 1fr; gap: 10px 12px; margin-bottom: 18px; }
  .meta-grid label { align-self: center; color: var(--dim); font-size: 14px; }
  input[type=text], input[type=url], select, textarea {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: rgba(255,255,255,0.04);
    color: var(--text); font-family: inherit; font-size: 14px; line-height: 1.6;
  }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); }

  .panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .panel-head .pno {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,213,79,.15); color: var(--gold); font-weight: 700; font-size: 13px;
  }
  .panel-head h2 { margin: 0; font-size: 16px; }

  .sec { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; background: var(--panel); }
  .sec__head { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  .sec__head input { flex: 1; font-weight: 700; }
  .subhead { margin: 16px 0 10px; font-size: 14px; color: var(--dim); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  .q { border: 1px dashed var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; background: rgba(255,255,255,0.02); }
  .q__head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .q__badge { padding: 2px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); color: var(--dim); }
  .q__badge.choice { color: var(--blue); border-color: rgba(100,181,246,.5); }
  .q__badge.essay { color: var(--gold); border-color: rgba(255,213,79,.5); }
  .q__head .grow { flex: 1; }

  .field { margin-bottom: 10px; }
  .field > .lbl { display: block; margin-bottom: 5px; color: var(--dim); font-size: 13px; }
  .field .tools { display: flex; gap: 6px; margin-top: 6px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .opt { display: grid; grid-template-columns: 70px 1fr auto; gap: 8px; align-items: center; margin-bottom: 6px; }
  .opt input[type=text].key { text-align: center; }

  .answer-row { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .answer-row label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

  .hint { color: var(--dim); font-size: 13px; margin: -4px 0 14px; }
  .hint--ok { color: var(--success); }
  .hint--warn { color: var(--gold); }
  #validate-status { margin-top: -8px; }
  #tree-status { margin: 12px 2px 0; font-size: 12px; }

  /* 预览区 */
  .preview { font-size: 15px; }
  .preview .sec { background: transparent; border: none; padding: 0; margin-bottom: 26px; }
  .preview .sec__title { color: var(--gold); font-size: 17px; margin: 0 0 12px; padding-left: 10px; border-left: 3px solid var(--gold); }
  .preview .q { border: 1px solid var(--line); border-style: solid; background: rgba(255,255,255,0.03); }
  .preview .no { display:inline-flex; align-items:center; justify-content:center; min-width:26px; height:26px; border-radius:50%; background: rgba(255,213,79,.15); color: var(--gold); font-weight:700; margin-right:8px; font-size: 13px; }
  .preview .material { padding: 12px 14px; background: rgba(11,16,38,.6); border-left: 3px solid var(--cyan); margin-bottom: 10px; }
  .preview .stem { font-weight: 700; margin: 0 0 12px; }
  .preview .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .preview .opt-btn { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.03); }
  .preview .opt-btn.correct { border-color: var(--success); background: rgba(102,187,106,.15); }
  .preview .stems { margin: 0 0 12px; padding-left: 20px; }
  .preview .answer { margin-top: 10px; padding: 12px 14px; border: 1px solid rgba(255,213,79,.4); background: rgba(255,213,79,.06); border-radius: 8px; }
  .preview .answer h5 { margin: 0 0 6px; color: var(--gold); font-size: 14px; }
  .preview table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 14px; }
  .preview th, .preview td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; }
  .preview th { background: rgba(79,195,247,.12); color: #bfe9ff; }
  .preview img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); margin: 8px 0; }
  .preview code { background: rgba(255,255,255,.1); padding: 1px 5px; border-radius: 4px; }
  .preview .p { margin: 0 0 8px; }
  .preview .empty { color: var(--dim); }

  .out {
    width: 100%; min-height: 160px; margin-top: 10px;
    font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
    background: #060b1e;
  }
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    padding: 10px 20px; border-radius: 8px; background: var(--blue); color: #06122b;
    font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 99;
  }
  .toast.show { opacity: 1; }
  details.export { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 14px; }
  details.export summary { cursor: pointer; color: var(--cyan); }
</style>
</head>
<body>
<header class="bar">
  <h1>练习编辑器</h1>
  <span class="badge" id="lesson-badge"></span>
  <button class="btn btn--ghost btn--sm" data-act="validate">校验</button>
  <span class="grow"></span>
  <button class="btn btn--ghost btn--sm" data-act="load-html">载入课程结构</button>
  <input type="file" id="manifest-file" accept=".html,text/html" hidden>
  <label class="btn btn--ghost btn--sm" style="margin:0">
    导入
    <input type="file" id="import-file" accept=".js,.json,application/json,text/javascript" hidden>
  </label>
  <button class="btn btn--ghost btn--sm" data-act="load-file">载入同目录文件</button>
  <button class="btn btn--primary btn--sm" data-act="save-file">保存到本文件</button>
  <button class="btn btn--ghost btn--sm" data-act="download">导出 practice-data.js</button>
  <button class="btn btn--ghost btn--sm" data-act="copy">复制</button>
</header>

<main>
  <aside class="col col--tree">
    <h2 class="rail__title">模块</h2>
    <div id="tree"></div>
    <p class="hint" id="tree-status"></p>
  </aside>

  <section class="col col--edit">
    <p class="hint" id="validate-status" aria-live="polite"></p>
    <div id="editor"></div>
  </section>

  <section class="col col--preview">
    <div class="preview" id="preview"></div>
    <details class="export">
      <summary>导出内容预览 / 手动复制</summary>
      <textarea class="out" id="output" readonly></textarea>
    </details>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   练习编辑器（离线单文件，无任何外部依赖）
   ------------------------------------------------------------
   - 结构来源：lesson-manifest.js（window.__LESSON_MANIFEST__，构建期生成的只读契约）；
   - 内容来源：practice-data.js（window.__PRACTICE_DATA__，教师可编辑真源）；
   - 左侧模块树（M1…M9 + 课后练习）→ 逐模块编辑（choice / essay）→ 右侧实时预览；
   - 导出统一 practice-data.js（写入 version / updatedAt）。
   数据模型见 shared/custom-quiz-editor/docs/自定义练习题模块_开发文档.md 第二部分。
   ============================================================ */
(function () {
  'use strict';
  var STORE_KEY = 'practice-editor-state-v1';
  var MANIFEST_FILE = './lesson-manifest.js';
  var DATA_FILE = './practice-data.js';

  var FILE_HEADER =
    '/* ============================================================\n' +
    ' * 随堂练习 · 数据文件（教师可按学情自行编辑）\n' +
    ' * ------------------------------------------------------------\n' +
    ' * 由「练习编辑器」生成：modules = 各模块随堂练习，postLesson = 课后练习。\n' +
    ' * 分发后直接替换本文件即可更新练习，无需重新构建、无需联网。\n' +
    ' * modules 的键 = lesson-manifest 的模块 id（稳定主键，如 universe）；\n' +
    ' * kind 为 "drag" 的模块为拖拽题占位，内容仍由源码提供，编辑器只读。\n' +
    ' * ============================================================ */\n';

  /* ---------- Markdown 子集渲染（与运行时模块保持一致） ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function attr(s) { return esc(s).replace(/"/g, '&quot;'); }
  function inline(s) {
    var t = esc(s);
    t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (m, alt, src) {
      return '<img src="' + src + '" alt="' + alt + '">';
    });
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, label, href) {
      return '<a href="' + href + '" target="_blank" rel="noopener">' + label + '</a>';
    });
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    return t;
  }
  function isRow(l) { return /^\s*\|.*\|\s*$/.test(l); }
  function isSep(l) { return /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(l) && l.indexOf('|') >= 0; }
  function splitRow(l) {
    return l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); });
  }
  function isBullet(l) { return /^\s*[-*]\s+/.test(l); }
  function isOrdered(l) { return /^\s*\d+[.、]\s+/.test(l); }
  function md(src) {
    if (!src) return '';
    var lines = String(src).replace(/\r\n?/g, '\n').split('\n');
    var out = [], i = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }
      if (isRow(line) && i + 1 < lines.length && isSep(lines[i + 1])) {
        var head = splitRow(line), j = i + 2, rows = [];
        while (j < lines.length && isRow(lines[j])) { rows.push(splitRow(lines[j])); j++; }
        out.push('<table><thead><tr>' + head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') +
          '</tr></thead><tbody>' + rows.map(function (r) {
            return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table>');
        i = j; continue;
      }
      if (isBullet(line)) {
        var items = [];
        while (i < lines.length && isBullet(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, '')); i++; }
        out.push('<ul>' + items.map(function (t) { return '<li>' + inline(t) + '</li>'; }).join('') + '</ul>');
        continue;
      }
      if (isOrdered(line)) {
        var oitems = [];
        while (i < lines.length && isOrdered(lines[i])) { oitems.push(lines[i].replace(/^\s*\d+[.、]\s+/, '')); i++; }
        out.push('<ol>' + oitems.map(function (t) { return '<li>' + inline(t) + '</li>'; }).join('') + '</ol>');
        continue;
      }
      var para = [];
      while (i < lines.length && lines[i].trim() && !isRow(lines[i]) && !isBullet(lines[i]) && !isOrdered(lines[i])) {
        para.push(lines[i]); i++;
      }
      out.push('<p class="p">' + para.map(inline).join('<br>') + '</p>');
    }
    return out.join('');
  }

  /* ---------- 通用工具 ---------- */
  function el(sel, root) { return (root || document).querySelector(sel); }
  function els(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function getPath(obj, path) {
    var parts = String(path).split('.'), cur = obj;
    for (var i = 0; i < parts.length; i++) { if (cur == null) return undefined; cur = cur[parts[i]]; }
    return cur;
  }
  function setPath(obj, path, value) {
    var parts = String(path).split('.'), cur = obj;
    for (var i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
    cur[parts[parts.length - 1]] = value;
  }
  function clone(v) { return JSON.parse(JSON.stringify(v)); }

  /* ---------- 数据模型 ---------- */
  var manifest = window.__LESSON_MANIFEST__ || null;
  var state = null;
  var selectedId = '';

  function newChoice() {
    return {
      id: '', type: 'choice', mode: 'single', source: '', material: '', stem: '',
      options: [{ key: 'A', text: '' }, { key: 'B', text: '' }, { key: 'C', text: '' }, { key: 'D', text: '' }],
      answer: 'A', analysis: '', knowledge: { title: '', items: [] }
    };
  }
  function newEssay() {
    return {
      id: '', type: 'essay', source: '', material: '', stems: [''],
      referenceAnswer: '', analysis: '', criteria: ['']
    };
  }
  function emptyState() {
    return {
      version: 1,
      lesson: (manifest && manifest.lesson) || '',
      updatedAt: '',
      modules: {},
      postLesson: {
        title: (manifest && manifest.postLesson && manifest.postLesson.title) || '自定义练习',
        subtitle: '',
        sections: []
      }
    };
  }

  /* ---------- 模块树 ---------- */
  function treeItems() {
    var items = [];
    if (manifest && manifest.modules) {
      manifest.modules.forEach(function (m) {
        // 编辑器只处理通用题型（choice / essay）；特殊题型（如 kind:"drag"）由课程侧自行硬编码，不在此呈现
        if (m.kind && m.kind !== 'choice') return;
        items.push({ kind: 'module', id: m.id, no: m.no, title: m.title, nav: m.nav });
      });
    }
    if (manifest && manifest.postLesson) {
      items.push({ kind: 'postLesson', id: manifest.postLesson.id || 'quiz-custom', no: manifest.postLesson.no, title: manifest.postLesson.title, nav: manifest.postLesson.nav });
    }
    // 数据里出现、但清单中没有的模块 → 孤儿题目
    var known = {};
    items.forEach(function (it) { known[it.id] = true; });
    Object.keys((state && state.modules) || {}).forEach(function (id) {
      if (known[id]) return;
      var mod = state.modules[id];
      if (mod && mod.questions && mod.questions.length) {
        items.push({ kind: 'module', id: id, no: '', title: mod.title || id, nav: '', orphan: true });
      }
    });
    return items;
  }
  function findItem(id) {
    var items = treeItems();
    for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i];
    return null;
  }
  function selectedItem() {
    var it = findItem(selectedId);
    if (it) return it;
    var all = treeItems();
    return all[0] || null;
  }
  function ensureSelected() {
    var all = treeItems();
    if (!all.length) { selectedId = ''; return; }
    if (!findItem(selectedId)) selectedId = all[0].id;
  }
  function ensureModule(it) {
    if (!state.modules) state.modules = {};
    if (!state.modules[it.id]) {
      state.modules[it.id] = { title: '', intro: '', questions: [] };
    }
    return state.modules[it.id];
  }
  function moduleCount(id) {
    var mod = state.modules && state.modules[id];
    return mod && mod.questions ? mod.questions.length : 0;
  }
  function postLessonCount() {
    var secs = (state.postLesson && state.postLesson.sections) || [];
    return secs.reduce(function (n, s) { return n + ((s.questions && s.questions.length) || 0); }, 0);
  }

  /* ---------- 本机草稿 ---------- */
  var saveTimer = null;
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && (parsed.modules || parsed.postLesson)) { state = parsed; return true; }
      }
    } catch (e) { /* 忽略损坏数据 */ }
    return false;
  }
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
    }, 300);
  }

  function toast(msg) {
    var t = el('#toast');
    if (!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  /* ---------- 表单片段 ---------- */
  function toolsHtml() {
    return '<div class="tools">' +
      '<button class="btn btn--ghost btn--sm" data-insert-image>插入图片</button>' +
      '<button class="btn btn--ghost btn--sm" data-insert-table>插入表格</button>' +
      '</div>';
  }
  function areaHtml(label, path, value, rows) {
    return '<div class="field"><span class="lbl">' + label + '</span>' +
      '<textarea rows="' + (rows || 2) + '" data-path="' + attr(path) + '">' + esc(value || '') + '</textarea>' +
      toolsHtml() + '</div>';
  }
  function inputHtml(label, path, value) {
    return '<div class="field"><span class="lbl">' + label + '</span>' +
      '<input type="text" data-path="' + attr(path) + '" value="' + attr(value || '') + '"></div>';
  }

  function optionHtml(base, oi, opt) {
    return '<div class="opt">' +
      '<input type="text" class="key" data-path="' + attr(base) + '.options.' + oi + '.key" value="' + attr(opt.key) + '">' +
      '<input type="text" data-path="' + attr(base) + '.options.' + oi + '.text" value="' + attr(opt.text) + '" placeholder="选项内容">' +
      '<button class="btn btn--danger btn--sm" data-act="del-option" data-base="' + attr(base) + '" data-oi="' + oi + '">删</button>' +
      '</div>';
  }
  function answerHtml(base, q) {
    var isMulti = q.mode === 'multiple';
    var selected = Array.isArray(q.answer) ? q.answer : [q.answer];
    return '<div class="field"><span class="lbl">正确答案（' + (isMulti ? '多选，勾选所有正确项' : '单选') + '）</span>' +
      '<div class="answer-row">' + (q.options || []).map(function (opt) {
        var on = selected.indexOf(opt.key) >= 0;

  function choiceFormHtml(base, q) {

  function questionFormHtml(qbase, qi, q) {

        '<button class="btn btn--danger btn--sm" data-act="del-q" data-qbase="' + attr(qbase) + '" data-qi="' + qi + '">删除</button>' +

  /* ---------- 编辑区渲染 ---------- */
  function moduleEditorHtml(it) {

  function postLessonEditorHtml(it) {

            '<button class="btn btn--ghost btn--sm" data-act="add-choice" data-qbase="' + attr(qbase) + '">+ 选择题</button>' +
            '<button class="btn btn--ghost btn--sm" data-act="add-essay" data-qbase="' + attr(qbase) + '">+ 综合题</button>' +
          '</div>' +

  function renderEditor() {
    var node = el('#editor');

      node.innerHTML = '<div class="sec"><h3 class="sec__title">未加载课程结构</h3>' +

        '<code>index.html</code>（或将其拖入左侧模块栏），编辑器会用同一套规则现场解析出模块结构；' +
        '也可将本编辑器放在课程分发包的 <code>dist/</code> 目录（与 <code>index.html</code>、' +
        '<code>lesson-manifest.js</code>、<code>practice-data.js</code> 同级）后使用。</p></div>';
      return;

    if (!it) { node.innerHTML = '<p class="hint">请选择左侧模块</p>'; return; }
    node.innerHTML = it.kind === 'postLesson' ? postLessonEditorHtml(it) : moduleEditorHtml(it);
  }

  /* ---------- 模块树渲染 ---------- */
  function renderTree() {
    var items = treeItems();
    var html = items.map(function (it) {
      var meta, empty = false;
      if (it.kind === 'module') { var n = moduleCount(it.id); meta = n + ' 题'; empty = n === 0; }
      else { var n2 = postLessonCount(); meta = n2 + ' 题'; empty = n2 === 0; }
      var cls = 'tree__item' + (it.id === selectedId ? ' is-active' : '') + (it.orphan ? ' is-dim' : '');
      return '<button class="' + cls + '" data-select="' + attr(it.id) + '">' +
        '<span class="tree__line"><span class="tree__no">' + esc(it.no || '') + '</span>' +
        '<span class="tree__name">' + esc(it.title || it.id) + '</span></span>' +
        '<span class="tree__meta' + (empty ? ' is-empty' : '') + '">' + meta + '</span>' +
        '</button>';
    }).join('');
    el('#tree').innerHTML = html || '<p class="hint">未找到课程结构</p>';

    var b = el('#lesson-badge');
    if (b) b.textContent = manifest ? (manifest.lesson || '') : '';
    var st = el('#tree-status');
    if (st) {
      var notes = treeSummary();
      st.textContent = manifest
        ? (notes.length ? notes.join('；') : '结构已就绪')
        : '未找到 lesson-manifest.js（可载入 index.html）';
      st.className = 'hint' + (manifest && notes.length ? ' hint--warn' : '');
    }
  }
  function treeSummary() {
    var notes = [];
    var unedited = [];
    treeItems().forEach(function (it) {
      if (it.kind !== 'module' || it.orphan) return;
      if (!moduleCount(it.id)) unedited.push(it.id);
    });
    var known = {};
    (manifest && manifest.modules ? manifest.modules : []).forEach(function (m) { known[m.id] = true; });
    var orphans = Object.keys((state && state.modules) || {}).filter(function (id) {
      var mod = state.modules[id];
      return !known[id] && mod && mod.questions && mod.questions.length;
    });
    if (unedited.length) notes.push(unedited.length + ' 个模块未编辑（运行时回退内置题目）');
    if (orphans.length) notes.push(orphans.length + ' 个孤儿模块');
    return notes;
  }

  /* ---------- 预览渲染 ---------- */
  function previewQuestionHtml(q, no) {
    if (q.type === 'essay') {
      var stems = Array.isArray(q.stems) ? q.stems : (q.stems ? [q.stems] : []);
      return '<div class="q"><div>' +
        '<span class="no">' + no + '</span><span class="q__badge essay">综合题</span>' +
        (q.material ? '<div class="material">' + md(q.material) + '</div>' : '') +
        (stems.length ? '<ol class="stems">' + stems.map(function (s) { return '<li>' + inline(s) + '</li>'; }).join('') + '</ol>' : '') +
        '<div class="answer"><h5>参考答案</h5>' + (md(q.referenceAnswer) || '<span class="empty">（未填写）</span>') +
        (q.analysis ? '<h5>解析</h5>' + md(q.analysis) : '') +
        (q.criteria && q.criteria.length ? '<h5>评分标准</h5><ol>' + q.criteria.map(function (c) { return '<li>' + inline(c) + '</li>'; }).join('') + '</ol>' : '') +
        '</div></div></div>';
    }
    var answer = Array.isArray(q.answer) ? q.answer : [q.answer];
    return '<div class="q"><div>' +
      '<span class="no">' + no + '</span><span class="q__badge choice">' + (q.mode === 'multiple' ? '多选题' : '单选题') + '</span>' +
      (q.material ? '<div class="material">' + md(q.material) + '</div>' : '') +
      '<p class="stem">' + inline(q.stem || '') + '</p>' +
      '<div class="options">' + (q.options || []).map(function (opt) {
        var c = answer.indexOf(opt.key) >= 0 ? ' correct' : '';
        return '<div class="opt-btn' + c + '">' + esc(opt.key) + '. ' + inline(opt.text) + '</div>';
      }).join('') + '</div>' +
      '<div class="answer"><h5>正确答案：' + answer.join('') + '</h5>' +
      (q.analysis ? md(q.analysis) : '<span class="empty">（未填写解析）</span>') +
      (q.knowledge && q.knowledge.items && q.knowledge.items.length
        ? '<h5>知识归纳</h5>' + (q.knowledge.title ? '<p>' + inline(q.knowledge.title) + '</p>' : '') +
          '<ul>' + q.knowledge.items.map(function (t) { return '<li>' + inline(t) + '</li>'; }).join('') + '</ul>'
        : '') +
      '</div></div></div>';
  }

  function renderPreview() {
    var node = el('#preview');
    if (!node) return;
    var it = selectedItem();
    var no = 1, html = '';
    if (!it) {
      node.innerHTML = '<p class="empty">请选择左侧模块</p>';
      renderOutput();
      return;
    }
    if (it.kind === 'module') {
      var mod = (state.modules && state.modules[it.id]) || {};
      html = '<div class="sec"><h3 class="sec__title">' + esc(mod.title || it.title) + '</h3>' +
        (mod.intro ? '<p class="p">' + inline(mod.intro) + '</p>' : '') +
        (mod.questions || []).map(function (q) { return previewQuestionHtml(q, no++); }).join('') +
        '</div>';
      if (!(mod.questions || []).length) html += '<p class="empty">该模块暂无题目</p>';
    } else {
      var pl = state.postLesson || {};
      html = (pl.sections || []).map(function (sec) {
        return '<div class="sec"><h3 class="sec__title">' + esc(sec.title || '') + '</h3>' +
          (sec.questions || []).map(function (q) { return previewQuestionHtml(q, no++); }).join('') + '</div>';
      }).join('');
      if (!html) html = '<p class="empty">课后练习暂无内容</p>';
    }
    node.innerHTML = html;
    renderOutput();
  }

  /* ---------- 导出 ---------- */
  function generated() {
    var modules = {};
    Object.keys((state && state.modules) || {}).forEach(function (id) {
      var mod = state.modules[id];
      if (!mod) return;
      if (!mod.questions || !mod.questions.length) return;
      var out = {};
      if (mod.title) out.title = mod.title;
      if (mod.intro) out.intro = mod.intro;
      out.questions = mod.questions;
      modules[id] = out;
    });
    var payload = {
      version: state.version || 1,
      lesson: state.lesson || (manifest && manifest.lesson) || '',
      updatedAt: new Date().toISOString(),
      modules: modules
    };
    if (state.postLesson) payload.postLesson = state.postLesson;
    return FILE_HEADER + 'window.__PRACTICE_DATA__ = ' + JSON.stringify(payload, null, 2) + ';\n';
  }
  function renderOutput() { var o = el('#output'); if (o) o.value = generated(); }

  /* ---------- 校验 ---------- */
  function validateQuestion(q, label, issues) {
    if (q.type === 'essay') {
      var stems = (Array.isArray(q.stems) ? q.stems : [q.stems]).filter(function (s) { return s && String(s).trim(); });
      if (!stems.length) issues.push(label + '（综合题）：缺少设问');
      if (!q.referenceAnswer) issues.push(label + '（综合题）：缺少参考答案');
      return;
    }
    if (!q.stem) issues.push(label + '：缺少题干');
    var filled = (q.options || []).filter(function (o) { return o && String(o.text).trim(); });
    if (filled.length < 2) issues.push(label + '：至少需要两个有内容的选项');
    var keys = (q.options || []).map(function (o) { return o.key; });
    var answers = (Array.isArray(q.answer) ? q.answer : [q.answer]).filter(function (a) { return keys.indexOf(a) >= 0; });
    if (!answers.length) issues.push(label + '：未设置有效答案');
  }
  function validateState() {
    var issues = [];
    if (!manifest) issues.push('未加载 lesson-manifest.js，无法校验模块映射');
    if (!state.modules || !Object.keys(state.modules).length) {
      if (postLessonCount() === 0) issues.push('尚无任何题目（所有模块与课后练习均为空）');
    }
    // 逐模块逐题校验
    Object.keys((state && state.modules) || {}).forEach(function (id) {
      var mod = state.modules[id];
      if (!mod) return;
      var it = findItem(id);
      var label = it ? ((it.no ? it.no + ' ' : '') + (it.title || id)) : id;
      (mod.questions || []).forEach(function (q, qi) { validateQuestion(q, label + ' 第 ' + (qi + 1) + ' 题', issues); });
    });
    // 课后练习校验
    var pl = state.postLesson;
    if (pl && pl.sections) {
      pl.sections.forEach(function (sec, si) {
        (sec.questions || []).forEach(function (q, qi) {
          validateQuestion(q, '课后练习 第 ' + (si + 1) + ' 节 第 ' + (qi + 1) + ' 题', issues);
        });
      });
    }
    return issues;
  }
  function renderValidate() {
    var issues = validateState();
    var notes = treeSummary();
    var node = el('#validate-status');
    if (node) {
      var head = issues.length
        ? '校验发现 ' + issues.length + ' 处待完善：' + issues.slice(0, 2).join('；') + (issues.length > 2 ? ' 等' : '')
        : '校验通过：结构完整，可导出。';
      node.textContent = notes.length ? head + '  ·  ' + notes.join('；') : head;
      node.className = 'hint' + (issues.length || notes.length ? ' hint--warn' : ' hint--ok');
    }
    return issues;
  }

  /* ---------- 全量渲染 ---------- */
  function renderAll() {
    ensureSelected();
    renderTree();
    renderEditor();
    renderPreview();
    renderValidate();
  }

  /* ---------- 结构操作 ---------- */
  function renumberOptions(q) {
    q.options.forEach(function (o, i) { o.key = String.fromCharCode(65 + i); });
  }
  function handleStruct(act, t) {
    var qbase = t.dataset.qbase, qi = Number(t.dataset.qi);
    var base = t.dataset.base, oi = Number(t.dataset.oi);
    var sbase = t.dataset.sbase, si = Number(t.dataset.si);
    var arr, q;
    switch (act) {
      case 'add-section':
        if (!state.postLesson) state.postLesson = { title: '', subtitle: '', sections: [] };
        if (!state.postLesson.sections) state.postLesson.sections = [];
        state.postLesson.sections.push({ id: 'part-' + (state.postLesson.sections.length + 1), title: '', questions: [] });
        break;
      case 'del-section':
        arr = getPath(state, sbase);
        if (!arr || arr.length <= 1) { toast('至少保留一个分节'); return; }
        if (!confirm('删除该分节及其全部题目？')) return;
        arr.splice(si, 1); break;
      case 'add-choice':
        arr = getPath(state, qbase);
        if (arr) arr.push(newChoice());
        break;
      case 'add-essay':
        arr = getPath(state, qbase);
        if (arr) arr.push(newEssay());
        break;
      case 'del-q':
        arr = getPath(state, qbase);
        if (!arr) return;
        if (!confirm('删除该题？')) return;
        arr.splice(qi, 1); break;
      case 'dup-q':
        arr = getPath(state, qbase);
        if (arr) arr.splice(qi + 1, 0, clone(arr[qi]));
        break;
      case 'up-q':
        arr = getPath(state, qbase);
        if (arr && qi > 0) arr.splice(qi - 1, 0, arr.splice(qi, 1)[0]);
        break;
      case 'down-q':
        arr = getPath(state, qbase);
        if (arr && qi < arr.length - 1) arr.splice(qi + 1, 0, arr.splice(qi, 1)[0]);
        break;
      case 'add-option':
        q = getPath(state, base);
        if (q && q.options) q.options.push({ key: String.fromCharCode(65 + q.options.length), text: '' });
        break;
      case 'del-option':
        q = getPath(state, base);
        if (!q || !q.options) return;
        if (q.options.length <= 2) { toast('至少保留两个选项'); return; }
        q.options.splice(oi, 1); renumberOptions(q);
        if (!Array.isArray(q.answer) && q.options.every(function (o) { return o.key !== q.answer; })) q.answer = q.options[0].key;
        break;
      default: return;
    }
    save(); renderAll();
  }

  function selectItem(id) {
    selectedId = id;
    var it = findItem(id);
    if (it && it.kind === 'module') ensureModule(it);
    renderAll();
  }

  /* ---------- 富文本插入 ---------- */
  function insertAt(textarea, text) {
    var start = textarea.selectionStart || 0, end = textarea.selectionEnd || 0;
    var value = textarea.value;
    textarea.value = value.slice(0, start) + text + value.slice(end);
    var pos = start + text.length;
    textarea.selectionStart = textarea.selectionEnd = pos;
    textarea.focus();
    textarea.dispatchEvent(new Event('input', { bubbles: true }));
  }
  function pickImage(textarea) {
    var input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*';
    input.onchange = function () {
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        insertAt(textarea, '![' + (file.name || '图片') + '](' + reader.result + ')\n');
        toast('图片已转 base64 内联');
      };
      reader.readAsDataURL(file);
    };
    input.click();
  }
  function pickTable(textarea) {
    var cols = parseInt(prompt('表格列数（1-6）：', '3'), 10);
    if (!cols || cols < 1 || cols > 6) return;
    var rows = parseInt(prompt('表格数据行数（不含表头）：', '3'), 10);
    if (!rows || rows < 1) rows = 1;
    var head = [], sep = [], body = [];
    for (var c = 0; c < cols; c++) { head.push('表头' + (c + 1)); sep.push('---'); }
    for (var r = 0; r < rows; r++) {
      var row = [];
      for (var k = 0; k < cols; k++) row.push('内容');
      body.push('| ' + row.join(' | ') + ' |');
    }
    var table = '\n| ' + head.join(' | ') + ' |\n| ' + sep.join(' | ') + ' |\n' + body.join('\n') + '\n';
    insertAt(textarea, table);
  }

  /* ---------- 导出 / 复制 / 导入 ---------- */
  function download() {
    var blob = new Blob([generated()], { type: 'text/javascript;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'practice-data.js';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('已导出 practice-data.js');
  }
  function copyOut() {
    var text = generated();
    var done = function () { toast('已复制到剪贴板'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
    } else { fallbackCopy(text, done); }
  }
  function fallbackCopy(text, done) {
    var ta = el('#output');
    ta.value = text; ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('请手动复制下方文本'); }
  }
  function importFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var raw = String(reader.result);
        var m = raw.match(/\{[\s\S]*\}/);
        var parsed = JSON.parse(m ? m[0] : raw);
        if (adopt(parsed)) { save(); ensureSelected(); renderAll(); toast('导入成功'); }
        else throw new Error('无法识别的数据结构');
      } catch (err) { toast('导入失败：' + err.message); }
    };
    reader.readAsText(file);
  }

  /* ---------- 同目录文件读写（就近预填 / 写回） ----------
     结构与数据文件与主页面 index.html 同级：lesson-manifest.js（只读结构）、practice-data.js（可编辑内容）。
     file:// 下 fetch 会被 CORS 拦截，故读用经典 <script> 注入读取全局变量；
     写优先用 File System Access API 就近覆盖，不可用时回退为下载。 */
  function loadScript(src) {
    return new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = function () { if (s.parentNode) s.parentNode.removeChild(s); resolve(true); };
      s.onerror = function () { resolve(false); };
      document.head.appendChild(s);
    });
  }
  function loadManifest() {
    if (window.__LESSON_MANIFEST__) return Promise.resolve(window.__LESSON_MANIFEST__);
    return loadScript(MANIFEST_FILE).then(function () { return window.__LESSON_MANIFEST__ || null; });
  }

  /* S5：清单缺失时回退——用 DOMParser 跑与构建期（scripts/manifest.mjs）同一套抽取规则。
     仅取顶层模块 section（class 含 section），标题/序号取 .section__title / .section__tag-num，
     练习键与形态取 .practice-btn 的 data-practice / data-practice-kind，末个无练习按钮的 section 为课后练习。 */
  function extractManifestFromDoc(doc) {
    var modules = [], postLesson = null;
    var sections = doc.querySelectorAll('section.section');
    Array.prototype.forEach.call(sections, function (sec) {
      var id = sec.id || '';
      if (!id) return;
      var nav = sec.getAttribute('data-nav') || '';
      var noEl = sec.querySelector('.section__tag-num');
      var titleEl = sec.querySelector('.section__title');
      var btn = sec.querySelector('.practice-btn[data-practice]');
      var no = noEl ? noEl.textContent.replace(/\s+/g, ' ').trim() : '';
      var title = titleEl ? titleEl.textContent.replace(/\s+/g, ' ').trim() : '';
      if (!btn) { postLesson = { id: id, no: no, nav: nav, title: title }; return; }
      modules.push({
        key: btn.getAttribute('data-practice') || '', id: id, no: no, nav: nav, title: title,
        practice: true, kind: btn.getAttribute('data-practice-kind') || 'choice'
      });
    });
    return {
      contract: 'lesson-manifest', version: 1, lesson: '', title: doc.title || '',
      generatedAt: new Date().toISOString(), modules: modules, postLesson: postLesson
    };
  }
  function applyManifest(m) {
    if (!m) return false;
    manifest = m;
    if (!state) state = emptyState();
    state.lesson = state.lesson || manifest.lesson || '';
    if (!state.postLesson) state.postLesson = emptyState().postLesson;
    ensureSelected();
    renderAll();
    return true;
  }
  function loadManifestFromHtmlFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var doc = new DOMParser().parseFromString(String(reader.result), 'text/html');
        var m = extractManifestFromDoc(doc);
        if (!m.modules.length && !m.postLesson) throw new Error('未找到模块（需含 section.section 与 practice-btn[data-practice]）');
        applyManifest(m);
        toast('已从 index.html 解析课程结构（模块 ' + m.modules.length + '）');
      } catch (err) { toast('解析失败：' + err.message); }
    };
    reader.readAsText(file);
  }
  function loadDataFile() {
    if (window.__PRACTICE_DATA__) return Promise.resolve(window.__PRACTICE_DATA__);
    return loadScript(DATA_FILE).then(function () { return window.__PRACTICE_DATA__ || null; });
  }
  function adopt(data) {
    if (!data || typeof data !== 'object') return false;
    if (data.modules || data.postLesson) {
      state = {
        version: data.version || 1,
        lesson: data.lesson || (manifest && manifest.lesson) || '',
        updatedAt: data.updatedAt || '',
        modules: data.modules ? clone(data.modules) : {},
        postLesson: data.postLesson ? clone(data.postLesson) : { title: '练习', subtitle: '', sections: [] }
      };
      return true;
    }
    // 兼容旧 custom-quiz.js（仅 sections）→ 并入课后练习
    if (data.sections) {
      state = emptyState();
      state.postLesson = { title: data.title || '练习', subtitle: data.subtitle || '', sections: data.sections };
      return true;
    }
    return false;
  }
  function saveToFile() {
    var text = generated();
    if (!window.showSaveFilePicker) { download(); return; }
    window.showSaveFilePicker({
      suggestedName: 'practice-data.js',
      types: [{ description: 'JavaScript 数据文件', accept: { 'text/javascript': ['.js'] } }]
    }).then(function (handle) {
      return handle.createWritable().then(function (w) {
        return w.write(text).then(function () { return w.close(); });
      });
    }).then(function () { toast('已保存到所选文件'); })
      .catch(function (err) {
        if (err && err.name === 'AbortError') return;
        toast('直接保存不可用，已改为下载');
        download();
      });
  }

  /* ---------- 事件绑定 ---------- */
  function bindGlobal() {
    document.addEventListener('input', function (e) {
      var t = e.target;
      if (!(t.matches && t.matches('[data-path]'))) return;
      var path = t.dataset.path;
      if (/\.criteria$/.test(path) || /\.stems$/.test(path) || /\.knowledge\.items$/.test(path)) {
        setPath(state, path, t.value.split('\n'));
      } else {
        setPath(state, path, t.value);
      }
      save(); renderPreview(); renderTree(); renderValidate();
    });

    document.addEventListener('change', function (e) {
      var t = e.target;
      if (t.matches && t.matches('[data-answer]')) {
        var path = t.dataset.answer;
        if (t.dataset.multi === 'true') {
          var checked = els('[data-answer="' + path + '"]').filter(function (i) { return i.checked; }).map(function (i) { return i.value; });
          setPath(state, path, checked);
        } else {
          setPath(state, path, t.value);
        }
        save(); renderPreview(); renderValidate(); return;
      }
      if (t.matches && t.matches('[data-mode-path]')) {
        var q = getPath(state, t.dataset.modePath.replace(/\.mode$/, ''));
        if (q) {
          q.mode = t.value;
          if (t.value === 'single') q.answer = Array.isArray(q.answer) ? (q.answer[0] || 'A') : q.answer;
        }
        save(); renderEditor(); renderPreview(); renderTree(); renderValidate(); return;
      }
      if (t.id === 'manifest-file' && t.files && t.files[0]) { loadManifestFromHtmlFile(t.files[0]); t.value = ''; return; }
      if (t.id === 'import-file' && t.files && t.files[0]) importFile(t.files[0]);
    });

    document.addEventListener('click', function (e) {
      var pick = e.target.closest ? e.target.closest('[data-select]') : null;
      if (pick) { selectItem(pick.dataset.select); return; }
      var t = e.target.closest ? e.target.closest('button') : null;
      if (!t) return;
      if (t.hasAttribute('data-insert-image')) { var f = t.closest('.field'); var ta = f && f.querySelector('textarea'); if (ta) pickImage(ta); return; }
      if (t.hasAttribute('data-insert-table')) { var f2 = t.closest('.field'); var ta2 = f2 && f2.querySelector('textarea'); if (ta2) pickTable(ta2); return; }
      var act = t.dataset.act;
      if (!act) return;
      if (act === 'validate') { var v = renderValidate(); toast(v.length ? '校验发现 ' + v.length + ' 处待完善' : '校验通过'); return; }
      if (act === 'download') { download(); return; }
      if (act === 'copy') { copyOut(); return; }
      if (act === 'save-file') { saveToFile(); return; }
      if (act === 'load-html') { var mf = el('#manifest-file'); if (mf) mf.click(); return; }
      if (act === 'load-file') {
        loadDataFile().then(function (data) {
          if (adopt(data)) { ensureSelected(); renderAll(); toast('已载入同目录 practice-data.js'); }
          else toast('未找到同目录 practice-data.js');
        });
        return;
      }
      handleStruct(act, t);
    });

    // S5：把课程的 index.html 直接拖入左侧模块栏即可载入结构（清单缺失时的回退）
    var treeCol = document.querySelector('.col--tree');
    if (treeCol) {
      treeCol.addEventListener('dragover', function (e) { e.preventDefault(); treeCol.classList.add('is-drop'); });
      treeCol.addEventListener('dragleave', function () { treeCol.classList.remove('is-drop'); });
      treeCol.addEventListener('drop', function (e) {
        e.preventDefault(); treeCol.classList.remove('is-drop');
        var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) loadManifestFromHtmlFile(f);
      });
    }
  }

  /* ---------- 启动 ---------- */
  function init() {
    state = emptyState();
    var hadDraft = load();
    bindGlobal();
    renderAll();

    loadManifest().then(function (m) {
      if (m) manifest = m;
      if (manifest) {
        state.lesson = state.lesson || manifest.lesson || '';
        if (!state.postLesson) state.postLesson = emptyState().postLesson;
      }
      renderAll();
      return loadDataFile();
    }).then(function (data) {
      if (hadDraft) {
        if (data) toast('已载入本机草稿；如需同目录文件请点「载入同目录文件」');
        return;
      }
      if (adopt(data)) { ensureSelected(); renderAll(); toast('已载入同目录 practice-data.js'); }
    }).catch(function (err) {
      console.error('[练习编辑器] 初始化失败', err);
    });
  }

  init();
})();
</script>
</body>
</html>
