<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内容编辑器</title>
<style>
/* ============================================================
   内容编辑器（Content Editor）· 通用型结构化内容编辑器
   ------------------------------------------------------------
   - 零依赖、离线单文件；浅/深双主题；中性设计语言，无业务属性；
   - 全部业务名词、数据源、结构抽取规则均由配置注入（见 §配置）；
   - 令牌前缀 --ce-，类名前缀 ce-，状态类统一 is-*；
   - 视觉层级：字号 / 字重 / 间距 / 描边 / 阴影 承担信息层级，装饰仅作点缀。
   ============================================================ */

/* ---------- 设计令牌 ---------- */
.ce-app {
  /* 间距 */
  --ce-space-1: 4px;  --ce-space-2: 8px;  --ce-space-3: 12px; --ce-space-4: 16px;
  --ce-space-5: 20px; --ce-space-6: 24px; --ce-space-7: 32px; --ce-space-8: 40px;
  /* 圆角 */
  --ce-radius-sm: 6px; --ce-radius-md: 9px; --ce-radius-lg: 14px; --ce-radius-full: 999px;
  /* 字号 */
  --ce-fs-2xs: 11px; --ce-fs-xs: 12px; --ce-fs-sm: 13px; --ce-fs-md: 14px;
  --ce-fs-lg: 15px; --ce-fs-xl: 18px; --ce-fs-2xl: 22px;
  /* 行高 / 字距 */
  --ce-lh-tight: 1.3; --ce-lh-base: 1.6; --ce-tracking: .06em;
  /* 阴影 */
  --ce-shadow-xs: 0 1px 2px rgba(18, 22, 33, .05);
  --ce-shadow-sm: 0 1px 3px rgba(18, 22, 33, .07), 0 1px 2px rgba(18, 22, 33, .04);
  --ce-shadow-md: 0 8px 24px rgba(18, 22, 33, .10), 0 2px 6px rgba(18, 22, 33, .05);
  /* 动效 */
  --ce-dur-fast: 120ms; --ce-dur-base: 200ms;
  --ce-ease: cubic-bezier(.4, 0, .2, 1);
  /* 字体 */
  --ce-font: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  --ce-font-mono: ui-monospace, "Cascadia Mono", Consolas, "SFMono-Regular", monospace;

  /* 颜色（浅色） */
  --ce-bg: #f4f5f8;
  --ce-surface: #ffffff;
  --ce-surface-2: #f1f2f6;
  --ce-surface-3: #e7e9ef;
  --ce-surface-sunken: #eef0f4;
  --ce-border: #e3e6ed;
  --ce-border-strong: #ccd2dc;
  --ce-text: #17181c;
  --ce-text-muted: #5b6270;
  --ce-text-subtle: #8b919d;
  --ce-accent: #5b5bd6;
  --ce-accent-hover: #4f4fc7;
  --ce-accent-active: #4646b5;
  --ce-accent-soft: rgba(91, 91, 214, .09);
  --ce-accent-border: rgba(91, 91, 214, .38);
  --ce-on-accent: #ffffff;
  --ce-success: #157f4a;  --ce-success-soft: rgba(21, 127, 74, .11);
  --ce-warning: #a15c00;  --ce-warning-soft: rgba(161, 92, 0, .11);
  --ce-danger: #d92d20;   --ce-danger-soft: rgba(217, 45, 32, .09);
  --ce-on-solid: #ffffff;  /* 实底状态色上的文字（浅色主题状态色偏深 → 白字） */
  --ce-code-bg: #f5f6f9;
  --ce-ring: rgba(91, 91, 214, .30);
  --ce-overlay: rgba(20, 22, 28, .45);

  /* 尺寸 */
  --ce-control-h: 38px;
  --ce-control-h-sm: 30px;
  --ce-hit: 40px;
  --ce-panel-pad: var(--ce-space-6);
  --ce-card-pad: var(--ce-space-5);
  --ce-row-gap: 14px;
  --ce-nav-w: 264px;
}

.ce-app[data-theme="dark"] {
  --ce-bg: #131418;
  --ce-surface: #1b1d23;
  --ce-surface-2: #212329;
  --ce-surface-3: #2a2d34;
  --ce-surface-sunken: #17191e;
  --ce-border: #2c2f37;
  --ce-border-strong: #3d414b;
  --ce-text: #eceef2;
  --ce-text-muted: #a6acb8;
  --ce-text-subtle: #7c8290;
  --ce-accent: #9b9bf5;
  --ce-accent-hover: #adadf9;
  --ce-accent-active: #bcbcfa;
  --ce-accent-soft: rgba(155, 155, 245, .15);
  --ce-accent-border: rgba(155, 155, 245, .42);
  --ce-on-accent: #16171d;
  --ce-success: #4ade80;  --ce-success-soft: rgba(74, 222, 128, .15);
  --ce-warning: #fbbf24;  --ce-warning-soft: rgba(251, 191, 36, .15);
  --ce-danger: #f87171;   --ce-danger-soft: rgba(248, 113, 113, .15);
  --ce-on-solid: #0f1116;  /* 深色主题状态色偏亮 → 深字 */
  --ce-code-bg: #101216;
  --ce-ring: rgba(155, 155, 245, .32);
  --ce-overlay: rgba(4, 5, 8, .62);
  --ce-shadow-xs: 0 1px 2px rgba(0, 0, 0, .30);
  --ce-shadow-sm: 0 1px 3px rgba(0, 0, 0, .38);
  --ce-shadow-md: 0 10px 28px rgba(0, 0, 0, .48);
}

/* 紧凑密度：仅改令牌，不改组件结构 */
.ce-app[data-density="compact"] {
  --ce-control-h: 32px;
  --ce-control-h-sm: 28px;
  --ce-hit: 34px;
  --ce-panel-pad: var(--ce-space-4);
  --ce-card-pad: var(--ce-space-4);
  --ce-row-gap: 10px;
  --ce-nav-w: 232px;
}

/* ---------- 基础 ---------- */
*, *::before, *::after { box-sizing: border-box; }

body.ce-app {
  margin: 0;
  background: var(--ce-bg);
  color: var(--ce-text);
  font-family: var(--ce-font);
  font-size: var(--ce-fs-md);
  line-height: var(--ce-lh-base);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

:where(.ce-app) :focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px var(--ce-ring);
  border-color: var(--ce-accent-border);
}

/* 触屏设备放大命中区域 */
@media (pointer: coarse) {
  .ce-app { --ce-control-h: 44px; --ce-control-h-sm: 38px; --ce-hit: 46px; }
}

@media (prefers-reduced-motion: reduce) {
  .ce-app *, .ce-app *::before, .ce-app *::after {
    transition-duration: 0ms !important;
    animation-duration: 0ms !important;
    animation-iteration-count: 1 !important;
  }
}

/* ---------- 顶栏 ---------- */
.ce-header {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: var(--ce-space-4); flex-wrap: wrap;
  padding: var(--ce-space-4) var(--ce-space-6);
  background: var(--ce-surface);
  border-bottom: 1px solid var(--ce-border);
}
.ce-header__brand { display: flex; align-items: center; gap: var(--ce-space-3); min-width: 0; }
.ce-header__logo {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; flex: 0 0 auto;
  border-radius: var(--ce-radius-md);
  background: var(--ce-accent); color: var(--ce-on-accent);
  box-shadow: var(--ce-shadow-xs);
}
.ce-header__titles { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ce-header__title {
  margin: 0; font-size: var(--ce-fs-xl); font-weight: 650;
  line-height: var(--ce-lh-tight); letter-spacing: -.01em; white-space: nowrap;
}
.ce-header__subtitle { font-size: var(--ce-fs-xs); color: var(--ce-text-subtle); white-space: nowrap; }
.ce-header__grow { flex: 1 1 auto; }
.ce-header__actions { display: flex; align-items: center; gap: var(--ce-space-2); flex-wrap: wrap; }
.ce-header__divider { width: 1px; height: 24px; background: var(--ce-border); }

.ce-actiongroup { display: flex; align-items: center; gap: var(--ce-space-2); }

/* ---------- 上手引导条 ---------- */
.ce-guide {
  display: flex; align-items: center; gap: var(--ce-space-4); flex-wrap: wrap;
  padding: var(--ce-space-3) var(--ce-space-6);
  background: var(--ce-accent-soft);
  border-bottom: 1px solid var(--ce-border);
}
.ce-guide[hidden] { display: none; }
.ce-guide__main { display: flex; align-items: center; gap: var(--ce-space-3); flex-wrap: wrap; flex: 1 1 420px; }
.ce-guide__label {
  font-size: var(--ce-fs-xs); font-weight: 600; color: var(--ce-accent);
  letter-spacing: var(--ce-tracking); white-space: nowrap;
}
.ce-guide__steps { display: flex; align-items: center; gap: var(--ce-space-2); flex-wrap: wrap; margin: 0; padding: 0; list-style: none; }
.ce-guide__step {
  display: inline-flex; align-items: center; gap: var(--ce-space-2);
  padding: 3px var(--ce-space-3) 3px 3px;
  border-radius: var(--ce-radius-full);
  font-size: var(--ce-fs-xs); color: var(--ce-text-muted);
}
.ce-guide__step.is-current { background: var(--ce-surface); color: var(--ce-text); font-weight: 600; box-shadow: var(--ce-shadow-xs); }
.ce-guide__step.is-done { color: var(--ce-success); }
.ce-guide__dot {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; flex: 0 0 auto;
  border-radius: 50%; background: var(--ce-surface-3); color: var(--ce-text-muted);
  font-size: var(--ce-fs-2xs); font-weight: 700; font-variant-numeric: tabular-nums;
}
.ce-guide__step.is-current .ce-guide__dot { background: var(--ce-accent); color: var(--ce-on-accent); }
.ce-guide__step.is-done .ce-guide__dot { background: var(--ce-success-soft); color: var(--ce-success); }
.ce-guide__sep { color: var(--ce-text-subtle); font-size: var(--ce-fs-xs); }
.ce-guide__actions { display: flex; align-items: center; gap: var(--ce-space-2); flex: 0 0 auto; }

/* ---------- 工具条 ---------- */
.ce-toolbar {
  display: flex; align-items: center; gap: var(--ce-space-3); flex-wrap: wrap;
  padding: var(--ce-space-2) var(--ce-space-6);
  background: var(--ce-surface-2);
  border-bottom: 1px solid var(--ce-border);
}
.ce-toolbar__grow { flex: 1 1 auto; }
.ce-toolbar__group { display: flex; align-items: center; gap: var(--ce-space-2); }

.ce-status { margin: 0; font-size: var(--ce-fs-xs); color: var(--ce-text-muted); }
.ce-status--ok { color: var(--ce-success); }
.ce-status--warn { color: var(--ce-warning); }
.ce-status--error { color: var(--ce-danger); }
.ce-linkbtn {
  border: 0; padding: 0 2px; background: none; cursor: pointer;
  color: var(--ce-accent); font: inherit; text-decoration: underline;
  text-underline-offset: 2px;
}
.ce-note { margin: var(--ce-space-3) 2px 0; font-size: var(--ce-fs-xs); color: var(--ce-text-subtle); }

/* ---------- 按钮 ---------- */
.ce-btn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--ce-space-2);
  min-height: var(--ce-control-h); padding: 0 var(--ce-space-4);
  border: 1px solid var(--ce-border-strong); border-radius: var(--ce-radius-md);
  background: var(--ce-surface); color: var(--ce-text);
  font-family: inherit; font-size: var(--ce-fs-sm); font-weight: 550;
  cursor: pointer; white-space: nowrap; text-decoration: none;
  transition: background var(--ce-dur-fast) var(--ce-ease),
              border-color var(--ce-dur-fast) var(--ce-ease),
              color var(--ce-dur-fast) var(--ce-ease),
              box-shadow var(--ce-dur-fast) var(--ce-ease),
              transform var(--ce-dur-fast) var(--ce-ease);
}
.ce-btn:hover { background: var(--ce-surface-3); border-color: var(--ce-text-subtle); }
.ce-btn:active { transform: translateY(1px); }
.ce-btn[disabled], .ce-btn.is-disabled { opacity: .5; cursor: not-allowed; transform: none; }
.ce-btn.is-loading { color: transparent !important; pointer-events: none; }
.ce-btn.is-loading::after {
  content: ""; position: absolute; inset: 0; margin: auto;
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid currentColor; border-color: var(--ce-text-subtle);
  border-top-color: transparent; animation: ce-spin .7s linear infinite;
}
@keyframes ce-spin { to { transform: rotate(360deg); } }

.ce-btn--primary {
  background: var(--ce-accent); border-color: var(--ce-accent);
  color: var(--ce-on-accent); font-weight: 650;
  box-shadow: 0 1px 2px rgba(91, 91, 214, .28);
}
.ce-btn--primary:hover { background: var(--ce-accent-hover); border-color: var(--ce-accent-hover); }
.ce-btn--primary:active { background: var(--ce-accent-active); border-color: var(--ce-accent-active); }
.ce-btn--primary.is-loading::after { border-color: var(--ce-on-accent); border-top-color: transparent; }

.ce-btn--ghost { background: transparent; border-color: transparent; color: var(--ce-text-muted); }
.ce-btn--ghost:hover { background: var(--ce-surface-3); border-color: transparent; color: var(--ce-text); }

.ce-btn--danger { background: transparent; border-color: var(--ce-danger); color: var(--ce-danger); }
.ce-btn--danger:hover { background: var(--ce-danger-soft); border-color: var(--ce-danger); }

.ce-btn--sm { min-height: var(--ce-control-h-sm); padding: 0 var(--ce-space-3); font-size: var(--ce-fs-xs); }

.ce-iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: var(--ce-hit); height: var(--ce-hit); flex: 0 0 auto;
  border: 1px solid var(--ce-border-strong); border-radius: var(--ce-radius-md);
  background: var(--ce-surface); color: var(--ce-text-muted); cursor: pointer;
  transition: background var(--ce-dur-fast) var(--ce-ease), color var(--ce-dur-fast) var(--ce-ease),
              border-color var(--ce-dur-fast) var(--ce-ease);
}
.ce-iconbtn:hover { background: var(--ce-surface-3); color: var(--ce-text); border-color: var(--ce-text-subtle); }
.ce-iconbtn--plain { border-color: transparent; background: transparent; width: var(--ce-control-h-sm); height: var(--ce-control-h-sm); }
.ce-iconbtn--plain:hover { background: var(--ce-surface-3); }

/* 计数徽标 */
.ce-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: var(--ce-radius-full);
  background: var(--ce-danger); color: var(--ce-on-solid);
  font-size: var(--ce-fs-2xs); font-weight: 700; font-variant-numeric: tabular-nums;
}
.ce-badge[hidden] { display: none; }

/* ---------- 下拉菜单 ---------- */
.ce-menu { position: relative; }
.ce-menu__panel {
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 40;
  min-width: 190px; padding: var(--ce-space-1);
  background: var(--ce-surface); border: 1px solid var(--ce-border);
  border-radius: var(--ce-radius-md); box-shadow: var(--ce-shadow-md);
  display: flex; flex-direction: column; gap: 1px;
}
.ce-menu__panel[hidden] { display: none; }
.ce-menu__item {
  display: block; width: 100%; text-align: left;
  min-height: var(--ce-control-h-sm); padding: 0 var(--ce-space-3);
  border: 0; border-radius: var(--ce-radius-sm); background: transparent;
  color: var(--ce-text); font-family: inherit; font-size: var(--ce-fs-sm);
  cursor: pointer;
  transition: background var(--ce-dur-fast) var(--ce-ease);
}
.ce-menu__item:hover { background: var(--ce-surface-3); }

/* ---------- 分段控件 ---------- */
.ce-segment {
  display: inline-flex; padding: 2px; gap: 2px;
  background: var(--ce-surface-3); border-radius: var(--ce-radius-md);
}
.ce-segment__btn {
  min-height: calc(var(--ce-control-h) - 6px); padding: 0 var(--ce-space-3);
  border: none; border-radius: var(--ce-radius-sm); background: transparent;
  color: var(--ce-text-muted); font-family: inherit; font-size: var(--ce-fs-xs);
  cursor: pointer; transition: background var(--ce-dur-fast) var(--ce-ease), color var(--ce-dur-fast) var(--ce-ease);
}
.ce-segment__btn:hover { color: var(--ce-text); }
.ce-segment__btn[aria-pressed="true"] { background: var(--ce-surface); color: var(--ce-text); font-weight: 600; box-shadow: var(--ce-shadow-xs); }

/* ---------- 标签 ---------- */
.ce-tag {
  display: inline-flex; align-items: center;
  padding: 1px var(--ce-space-2); border-radius: var(--ce-radius-full);
  border: 1px solid var(--ce-border-strong); background: var(--ce-surface-2);
  color: var(--ce-text-muted); font-size: var(--ce-fs-2xs); line-height: 1.7;
  white-space: nowrap;
}
.ce-tag--info { background: var(--ce-accent-soft); border-color: var(--ce-accent-border); color: var(--ce-accent); }
.ce-tag--ok { background: var(--ce-success-soft); border-color: var(--ce-success); color: var(--ce-success); }
.ce-tag--warn { background: var(--ce-warning-soft); border-color: var(--ce-warning); color: var(--ce-warning); }
.ce-tag--danger { background: var(--ce-danger-soft); border-color: var(--ce-danger); color: var(--ce-danger); }

/* ---------- 布局外壳 ---------- */
.ce-shell { display: flex; flex-wrap: wrap; align-items: flex-start; min-height: 60vh; }

.ce-panel {
  padding: var(--ce-panel-pad);
  min-width: 0;
  border-right: 1px solid var(--ce-border);
}
.ce-panel:last-child { border-right: none; }
.ce-panel--nav { flex: 0 0 var(--ce-nav-w); max-width: var(--ce-nav-w); background: var(--ce-surface-2); }
.ce-panel--editor { flex: 1 1 480px; background: var(--ce-bg); }
.ce-panel--preview { flex: 1 1 480px; background: var(--ce-surface); }

/* 面板显隐（配置或用户切换） */
.ce-app[data-nav="off"] .ce-panel--nav { display: none; }
.ce-app[data-preview="off"] .ce-panel--preview { display: none; }

/* 预览折叠（previewCollapsible 开启时生效） */
.ce-app[data-preview-collapsed="on"] .ce-preview,
.ce-app[data-preview-collapsed="on"] .ce-drawer { display: none; }

.ce-app[data-preview-placement="bottom"] .ce-panel--preview {
  flex-basis: 100%; max-width: none;
  border-right: none; border-top: 1px solid var(--ce-border);
}

.ce-panel__head {
  display: flex; align-items: center; gap: var(--ce-space-2);
  margin-bottom: var(--ce-space-4);
}
.ce-panel__title {
  margin: 0; font-size: var(--ce-fs-xs); font-weight: 600;
  letter-spacing: var(--ce-tracking); color: var(--ce-text-subtle);
}
.ce-panel__grow { flex: 1 1 auto; }

/* ---------- 分组导航 ---------- */
.ce-nav { display: flex; flex-direction: column; gap: var(--ce-space-1); }
.ce-nav.is-dragover {
  outline: 2px dashed var(--ce-accent); outline-offset: 6px;
  border-radius: var(--ce-radius-md);
}
.ce-nav__item {
  display: block; width: 100%; text-align: left; min-height: 48px;
  padding: var(--ce-space-2) var(--ce-space-3);
  border: 1px solid transparent; border-left: 3px solid transparent;
  border-radius: var(--ce-radius-md); background: transparent;
  color: var(--ce-text); font-family: inherit; font-size: var(--ce-fs-sm);
  cursor: pointer;
  transition: background var(--ce-dur-fast) var(--ce-ease), border-color var(--ce-dur-fast) var(--ce-ease);
}
.ce-nav__item:hover { background: var(--ce-surface-3); }
.ce-nav__item.is-active {
  background: var(--ce-accent-soft);
  border-color: var(--ce-accent-border);
  border-left-color: var(--ce-accent);
}
.ce-nav__item--dim { opacity: .6; }
.ce-nav__line { display: flex; gap: var(--ce-space-2); align-items: center; }
.ce-nav__name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
.ce-nav__meta { display: block; margin-top: 3px; font-size: var(--ce-fs-2xs); color: var(--ce-text-subtle); }
.ce-nav__meta.is-empty { font-style: italic; }

.ce-index {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 24px; height: 21px; padding: 0 6px; flex: 0 0 auto;
  border-radius: var(--ce-radius-sm);
  background: var(--ce-surface-3); color: var(--ce-text-muted);
  font-family: var(--ce-font-mono); font-size: var(--ce-fs-xs); font-weight: 600;
}

/* ---------- 表单 ---------- */
.ce-field { display: block; margin-bottom: var(--ce-row-gap); }
.ce-field__label {
  display: flex; align-items: baseline; gap: var(--ce-space-2);
  margin-bottom: 6px; color: var(--ce-text-muted); font-size: var(--ce-fs-xs); font-weight: 550;
}
.ce-field__hint { color: var(--ce-text-subtle); font-size: var(--ce-fs-2xs); font-weight: 400; }
.ce-field__tools { display: flex; gap: var(--ce-space-2); margin-top: var(--ce-space-2); }

.ce-input, .ce-textarea, .ce-select {
  width: 100%; min-height: var(--ce-control-h); padding: 8px var(--ce-space-3);
  border: 1px solid var(--ce-border-strong); border-radius: var(--ce-radius-md);
  background: var(--ce-surface); color: var(--ce-text);
  font-family: inherit; font-size: var(--ce-fs-sm); line-height: var(--ce-lh-base);
  transition: border-color var(--ce-dur-fast) var(--ce-ease), box-shadow var(--ce-dur-fast) var(--ce-ease);
}
.ce-input:hover, .ce-textarea:hover, .ce-select:hover { border-color: var(--ce-text-subtle); }
.ce-textarea { resize: vertical; min-height: 72px; padding-top: 9px; }
.ce-input::placeholder, .ce-textarea::placeholder { color: var(--ce-text-subtle); }

  var CFG = deepMerge(clone(DEFAULT_CONFIG), window.__CONTENT_EDITOR_CONFIG__ || {});
  var SRC = CFG.source;
  var EXT = SRC.extract;

  /* ==========================================================
     二、通用工具
     ========================================================== */
  function clone(v) { return JSON.parse(JSON.stringify(v)); }

  function isPlainObject(v) { return v && typeof v === 'object' && !Array.isArray(v); }

  function deepMerge(base, extra) {
    if (!isPlainObject(extra)) return base;
    Object.keys(extra).forEach(function (k) {
      var v = extra[k];
      if (isPlainObject(v) && isPlainObject(base[k])) deepMerge(base[k], v);
      else if (v !== undefined) base[k] = v;
    });
    return base;
  }

  function el(sel, root) { return (root || document).querySelector(sel); }
  function els(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function getPath(obj, path) {
    var parts = String(path).split('.'), cur = obj;
    for (var i = 0; i < parts.length; i++) { if (cur == null) return undefined; cur = cur[parts[i]]; }
    return cur;
  }
  function setPath(obj, path, value) {
    var parts = String(path).split('.'), cur = obj;
    for (var i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
    cur[parts[parts.length - 1]] = value;
  }

  /** 文案取值与占位符替换：L('fields.stem') / L('itemCount', { n: 3 }) */
  function L(path, vars) {
    var v = getPath(CFG.labels, path);
    if (v == null) return path;
    return String(v).replace(/\{(\w+)\}/g, function (m, k) {
      return vars && Object.prototype.hasOwnProperty.call(vars, k) ? vars[k] : m;
    });
  }

  /* ==========================================================
     三、Markdown 子集渲染（自研，无依赖）
     ========================================================== */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function attr(s) { return esc(s).replace(/"/g, '&quot;'); }

  function inline(s) {
    var t = esc(s);
    t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (m, alt, src) {
      return '<img src="' + src + '" alt="' + alt + '">';
    });
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, label, href) {
      return '<a href="' + href + '" target="_blank" rel="noopener">' + label + '</a>';
    });
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    return t;
  }
  function isRow(l) { return /^\s*\|.*\|\s*$/.test(l); }
  function isSep(l) { return /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(l) && l.indexOf('|') >= 0; }
  function splitRow(l) {
    return l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); });
  }
  function isBullet(l) { return /^\s*[-*]\s+/.test(l); }
  function isOrdered(l) { return /^\s*\d+[.、]\s+/.test(l); }

  function md(src) {
    if (!src) return '';
    var lines = String(src).replace(/\r\n?/g, '\n').split('\n');
    var out = [], i = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }
      if (isRow(line) && i + 1 < lines.length && isSep(lines[i + 1])) {
        var head = splitRow(line), j = i + 2, rows = [];
        while (j < lines.length && isRow(lines[j])) { rows.push(splitRow(lines[j])); j++; }
        out.push('<table><thead><tr>' + head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') +
          '</tr></thead><tbody>' + rows.map(function (r) {
            return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table>');
        i = j; continue;
      }
      if (isBullet(line)) {
        var items = [];
        while (i < lines.length && isBullet(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, '')); i++; }
        out.push('<ul>' + items.map(function (t) { return '<li>' + inline(t) + '</li>'; }).join('') + '</ul>');
        continue;
      }
      if (isOrdered(line)) {
        var oitems = [];
        while (i < lines.length && isOrdered(lines[i])) { oitems.push(lines[i].replace(/^\s*\d+[.、]\s+/, '')); i++; }
        out.push('<ol>' + oitems.map(function (t) { return '<li>' + inline(t) + '</li>'; }).join('') + '</ol>');
        continue;
      }
      var para = [];
      while (i < lines.length && lines[i].trim() && !isRow(lines[i]) && !isBullet(lines[i]) && !isOrdered(lines[i])) {
        para.push(lines[i]); i++;
      }
      out.push('<p>' + para.map(inline).join('<br>') + '</p>');
    }
    return out.join('');
  }
  function inlineOrEmpty(s) {
    return String(s || '').trim() ? inline(s) : '<span class="ce-preview__empty">' + esc(L('emptyValue')) + '</span>';
  }

  /* ==========================================================
     四、数据模型（契约保持不变）
     ========================================================== */
  var manifest = null;
  var state = null;
  var selectedId = '';
  var collapsed = {};
  var guideDismissed = false;
  var guideForced = false;

  function newItem(kind) {
    if (kind === 'essay') {
      return {
        id: '', type: 'essay', source: '', material: '', stems: [''],
        referenceAnswer: '', analysis: '', criteria: ['']
      };
    }
    return {
      id: '', type: 'choice', mode: 'single', source: '', material: '', stem: '',
      options: [{ key: 'A', text: '' }, { key: 'B', text: '' }, { key: 'C', text: '' }, { key: 'D', text: '' }],
      answer: 'A', analysis: '', knowledge: { title: '', items: [] }
    };
  }

  function emptyState() {
    return {
      version: 1,
      lesson: (manifest && manifest.lesson) || '',
      updatedAt: '',
      modules: {},
      postLesson: {
        title: (manifest && manifest.postLesson && manifest.postLesson.title) || L('auxiliaryFallback'),
        subtitle: '',
        sections: []
      }
    };
  }

  /* ==========================================================
     五、本地存储（草稿 / 主题 / 布局 / 引导，失败静默降级）
     ========================================================== */
  function storeGet(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } }
  function storeSet(key, val) { try { window.localStorage.setItem(key, val); } catch (e) {} }

  var THEME_KEY = SRC.draftKey + ':theme';
  var LAYOUT_KEY = SRC.draftKey + ':layout';
  var GUIDE_KEY = SRC.draftKey + ':guide';

  var saveTimer = null;
  function loadDraft() {
    var raw = storeGet(SRC.draftKey);
    if (!raw) return false;
    try {
      var parsed = JSON.parse(raw);
      if (parsed && (parsed.modules || parsed.postLesson)) { state = parsed; return true; }
    } catch (e) { /* 损坏数据忽略 */ }
    return false;
  }
  function saveDraft() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { storeSet(SRC.draftKey, JSON.stringify(state)); }, 300);
  }

  /* ==========================================================
     六、分组导航
     ========================================================== */
  function hiddenKinds() { return CFG.schema.hiddenStructureKinds || []; }

  function navItems() {
    var items = [];
    if (manifest && manifest.modules) {
      manifest.modules.forEach(function (m) {
        if (m.kind && hiddenKinds().indexOf(m.kind) >= 0) return;
        items.push({ kind: 'group', id: m.id, no: m.no, title: m.title, nav: m.nav });
      });
    }
    if (manifest && manifest.postLesson) {
      items.push({
        kind: 'auxiliary',
        id: manifest.postLesson.id || 'auxiliary',
        no: manifest.postLesson.no,
        title: manifest.postLesson.title || L('auxiliaryFallback'),
        nav: manifest.postLesson.nav
      });
    }
    var known = {};
    items.forEach(function (it) { known[it.id] = true; });
    Object.keys((state && state.modules) || {}).forEach(function (id) {
      if (known[id]) return;
      var mod = state.modules[id];
      if (mod && mod.questions && mod.questions.length) {
        items.push({ kind: 'group', id: id, no: '', title: mod.title || id, nav: '', orphan: true });
      }
    });
    return items;
  }
  function findItem(id) {
    var items = navItems();
    for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i];
    return null;
  }
  function selectedItem() {
    return findItem(selectedId) || navItems()[0] || null;
  }
  function ensureSelected() {
    var all = navItems();
    if (!all.length) { selectedId = ''; return; }
    if (!findItem(selectedId)) selectedId = all[0].id;
  }
  function ensureGroup(it) {
    if (!state.modules) state.modules = {};
    if (!state.modules[it.id]) state.modules[it.id] = { title: '', intro: '', questions: [] };
    return state.modules[it.id];
  }
  function groupCount(id) {
    var mod = state.modules && state.modules[id];
    return mod && mod.questions ? mod.questions.length : 0;
  }
  function auxiliaryCount() {
    var secs = (state.postLesson && state.postLesson.sections) || [];
    return secs.reduce(function (n, s) { return n + ((s.questions && s.questions.length) || 0); }, 0);
  }
  function totalItems() {
    var n = Object.keys((state && state.modules) || {}).reduce(function (acc, id) { return acc + groupCount(id); }, 0);
    return n + auxiliaryCount();
  }
  function groupLabel(it) {
    return it ? ((it.no ? it.no + ' ' : '') + (it.title || it.id)) : '';
  }

  /* ==========================================================
     七、反馈：吐司 / 状态 / 对话框 / 菜单
     ========================================================== */
  function toast(msg, variant) {
    var t = el('#toast');
    if (!t) return;
    t.textContent = msg;
    t.className = 'ce-toast is-show' + (variant ? ' ce-toast--' + variant : '');
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.className = 'ce-toast'; }, 2600);
  }

  var dialogState = { onConfirm: null, lastFocus: null };
  var FOCUSABLE = ['button:not([disabled])', '[href]', 'input:not([disabled]):not([type="hidden"])',
    'select:not([disabled])', 'textarea:not([disabled])', '[tabindex]:not([tabindex="-1"])'];

  function openDialog(opts) {
    var dlg = el('#dialog');
    if (!dlg) return;
    dialogState.lastFocus = document.activeElement;
    dialogState.onConfirm = opts.onConfirm || null;
    el('#dialog-title').textContent = opts.title || L('dialog.title');
    el('#dialog-body').innerHTML = opts.body || '';
    var ok = el('#dialog-confirm');
    ok.textContent = opts.confirmText || L('dialog.confirm');
    ok.className = 'ce-btn ' + (opts.danger ? 'ce-btn--danger' : 'ce-btn--primary');
    dlg.hidden = false;
    var focusTarget = el('#dialog-body [data-autofocus]') || el('#dialog-cancel');
    if (focusTarget) focusTarget.focus();
  }
  function closeDialog() {
    var dlg = el('#dialog');
    if (!dlg || dlg.hidden) return;
    dlg.hidden = true;
    dialogState.onConfirm = null;
    var back = dialogState.lastFocus;
    if (back && back.focus) back.focus();
  }
  function confirmDialog(message, onYes) {
    openDialog({
      title: L('dialog.title'),
      body: '<p class="ce-dialog__text">' + esc(message) + '</p>',
      confirmText: L('dialog.confirm'),
      danger: true,
      onConfirm: onYes
    });
  }
  function trapFocus(e) {
    var dlg = el('#dialog');
    if (!dlg || dlg.hidden || e.key !== 'Tab') return;
    var panel = el('#dialog .ce-dialog__panel');
    if (!panel) return;
    var nodes = els(FOCUSABLE.join(','), panel);
    if (!nodes.length) return;
    var first = nodes[0], last = nodes[nodes.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  function closeMenu() {
    var panel = el('#more-menu');

  }
  function toggleMenu() {
    var panel = el('#more-menu');
    var btn = el('[data-act="toggle-menu"]');
    if (!panel || !btn) return;
    var open = panel.hidden;
    panel.hidden = !open;
    btn.setAttribute('aria-expanded', String(open));
    if (open) {
      var first = el('.ce-menu__item', panel);
      if (first) first.focus();
    }
  }

    if (!btn) return;
    btn.classList.toggle('is-loading', !!on);
    btn.setAttribute('aria-busy', on ? 'true' : 'false');
  }

  /* ==========================================================
     八、上手步骤引导
     ========================================================== */
  function guideSteps() {
    var hasStructure = !!manifest;
    var hasSelection = !!selectedId && hasStructure;
    var hasContent = totalItems() > 0;
    var issues = collectIssues();
    var clean = hasContent && issues.length === 0;
    return {
      done: [hasStructure, hasSelection, hasContent, clean],
      issues: issues
    };
  }

  function renderGuide() {
    var node = el('#guide');
    var btn = el('#guide-btn');
    if (!node) return;
    var enabled = !!CFG.layout.guide;
    if (!enabled) {
      node.hidden = true;
      if (btn) btn.hidden = true;
      return;
    }
    var g = guideSteps();
    var complete = g.done.every(Boolean);
    var visible = !guideDismissed && (!complete || guideForced);

    node.hidden = !visible;
    if (btn) btn.hidden = visible;

    if (!visible) return;

    var current = g.done.indexOf(false);
    var steps = CFG.labels.guide.steps || [];
    var stepsHtml = steps.map(function (s, i) {
      var cls = 'ce-guide__step' + (g.done[i] ? ' is-done' : (i === current ? ' is-current' : ''));
      var num = g.done[i] ? '✓' : String(i + 1);
      return '<li class="' + cls + '" title="' + attr((CFG.labels.guide.hints || [])[i] || '') + '">' +
        '<span class="ce-guide__dot">' + num + '</span><span>' + esc(s) + '</span></li>';
    }).join('<li class="ce-guide__sep" aria-hidden="true">›</li>');

    var action = guideAction(current);
    node.innerHTML =
      '<div class="ce-guide__main">' +
        '<span class="ce-guide__label">' + esc(L('guide.label')) + '</span>' +
        '<ol class="ce-guide__steps">' + stepsHtml + '</ol>' +
      '</div>' +
      '<div class="ce-guide__actions">' +
        (action ? '<button class="ce-btn ce-btn--sm ce-btn--primary" type="button" data-act="' + action.act + '">' + esc(action.label) + '</button>' : '') +
        '<button class="ce-iconbtn ce-iconbtn--plain" type="button" data-act="dismiss-guide" title="' + attr(L('guide.dismiss')) + '" aria-label="' + attr(L('guide.dismiss')) + '">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
        '</button>' +
      '</div>';
  }

  function guideAction(current) {
    var kinds = CFG.schema.itemKinds || [];
    var firstKind = kinds[0] || 'choice';
    switch (current) {
      case 0: return { act: 'import-structure', label: L('guide.nextImport') };
      case 1: return { act: 'guide-select', label: L('guide.nextSelect') };
      case 2: return { act: 'guide-add', label: L('guide.nextAdd', { k: (getPath(CFG.labels.kinds, firstKind) || firstKind) }) };
      case 3: return { act: 'validate', label: L('guide.nextValidate') };
      default: return { act: 'export', label: L('guide.nextExport') };
    }
  }

      areaHtml(L('fields.material'), base + '.material', q.material, 4, 'material') +

      areaHtml(L('fields.reference'), base + '.referenceAnswer', q.referenceAnswer, 4, 'reference') +
      areaHtml(L('fields.analysis'), base + '.analysis', q.analysis, 3, 'analysis') +
      areaHtml(L('fields.criteria'), base + '.criteria', (q.criteria || []).join('\n'), 3, 'criteria');
  }

  function itemFormHtml(qbase, qi, q) {
    var base = qbase + '.' + qi;
    var isEssay = q.type === 'essay';
    var kindLabel = isEssay ? L('kinds.essay') : L('kinds.choice');

        '<span class="ce-panel__grow"></span>' +
        '<div class="ce-card__actions">' +
          '<button class="ce-btn ce-btn--ghost ce-btn--sm" type="button" title="' + attr(L('itemActions.up')) + '" aria-label="' + attr(L('itemActions.up')) + '" data-act="up-item" data-qbase="' + attr(qbase) + '" data-qi="' + qi + '">↑</button>' +
          '<button class="ce-btn ce-btn--ghost ce-btn--sm" type="button" title="' + attr(L('itemActions.down')) + '" aria-label="' + attr(L('itemActions.down')) + '" data-act="down-item" data-qbase="' + attr(qbase) + '" data-qi="' + qi + '">↓</button>' +
          '<button class="ce-btn ce-btn--ghost ce-btn--sm" type="button" data-act="dup-item" data-qbase="' + attr(qbase) + '" data-qi="' + qi + '">' + esc(L('itemActions.duplicate')) + '</button>' +
          '<button class="ce-btn ce-btn--ghost ce-btn--sm" type="button" data-act="del-item" data-qbase="' + attr(qbase) + '" data-qi="' + qi + '">' + esc(L('itemActions.remove')) + '</button>' +

  function addItemButtonsHtml(qbase, emphasizeFirst) {
    return '<div class="ce-btn-row">' + (CFG.schema.itemKinds || []).map(function (k, i) {

  function auxiliaryEditorHtml(it) {

  function emptyStateHtml() {
    var steps = (CFG.labels.guide.steps || []).map(function (s, i) {

      return '<li class="ce-empty__step">' +

    }).join('');
    return '<div class="ce-empty">' +
      '<div class="ce-empty__icon" aria-hidden="true">' +

        '<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18M9 9v11"/></svg>' +
      '</div>' +
      '<p class="ce-empty__title">' + esc(L('notLoadedTitle')) + '</p>' +
      '<p class="ce-empty__text">' + esc(L('notLoadedText')) + '</p>' +
      '<ol class="ce-empty__steps">' + steps + '</ol>' +
      '<div class="ce-empty__actions">' +
        '<button class="ce-btn ce-btn--primary" type="button" data-act="import-structure">' + esc(L('actions.importStructure')) + '</button>' +
        '<button class="ce-btn" type="button" data-act="load-local">' + esc(L('actions.loadLocal')) + '</button>' +
      '</div>' +
      '<p class="ce-empty__text ce-field__hint">' + esc(L('dropHint')) + '</p>' +
    '</div>';

  function renderEditor() {
    var node = el('#editor');
    if (!node) return;
    if (!manifest && navItems().length === 0) {
      node.innerHTML = emptyStateHtml();
      return;
    }
    var it = selectedItem();
    if (!it) { node.innerHTML = '<p class="ce-status">' + esc(L('selectionEmpty')) + '</p>'; return; }
    node.innerHTML = it.kind === 'auxiliary' ? auxiliaryEditorHtml(it) : groupEditorHtml(it);
  }

  /* ==========================================================
     十、分组导航渲染
     ========================================================== */
  function renderNav() {
    var items = navItems();
    var html = items.map(function (it) {
      var n = it.kind === 'group' ? groupCount(it.id) : auxiliaryCount();
      var cls = 'ce-nav__item' +
        (it.id === selectedId ? ' is-active' : '') +
        (it.orphan ? ' ce-nav__item--dim' : '');
      return '<button class="' + cls + '" type="button" data-select="' + attr(it.id) + '">' +
        '<span class="ce-nav__line">' +
          (it.no ? '<span class="ce-index">' + esc(it.no) + '</span>' : '') +
          '<span class="ce-nav__name">' + esc(it.title || it.id) + '</span>' +
        '</span>' +
        '<span class="ce-nav__meta' + (n === 0 ? ' is-empty' : '') + '">' + esc(L('itemCount', { n: n })) + '</span>' +
        '</button>';
    }).join('');
    el('#tree').innerHTML = html || '<p class="ce-note">' + esc(L('emptyNav')) + '</p>';

    var sub = el('#context-badge');
    if (sub) {
      var ctx = manifest ? (manifest.title || manifest.lesson || '') : '';
      sub.textContent = ctx || L('statusMissing');
    }
    var st = el('#tree-status');
    if (st) {
      var notes = navSummary();
      st.textContent = manifest
        ? (notes.length ? notes.join('；') : L('statusReady'))
        : L('statusMissing');
      st.className = 'ce-note' + (manifest && notes.length ? ' ce-status--warn' : '');
    }
  }

  function navSummary() {
    var notes = [];
    var unedited = [];
    navItems().forEach(function (it) {
      if (it.kind !== 'group' || it.orphan) return;
      if (!groupCount(it.id)) unedited.push(it.id);
    });
    var known = {};
    ((manifest && manifest.modules) || []).forEach(function (m) { known[m.id] = true; });
    var orphans = Object.keys((state && state.modules) || {}).filter(function (id) {
      var mod = state.modules[id];
      return !known[id] && mod && mod.questions && mod.questions.length;
    });
    if (unedited.length) notes.push(L('validation.unedited', { n: unedited.length }));
    if (orphans.length) notes.push(L('validation.orphan', { n: orphans.length }));
    return notes;
  }

  /* ==========================================================
     十一、预览渲染
     ========================================================== */
  function previewItemHtml(q, no) {
    var head = '<div class="ce-preview__head">' +
      '<span class="ce-index">' + no + '</span>' +
      '<span class="ce-tag' + (q.type === 'essay' ? ' ce-tag--info' : '') + '">' +
        esc(q.type === 'essay' ? L('kinds.essay') : (q.mode === 'multiple' ? L('kinds.multiple') : L('kinds.single'))) +
      '</span></div>';

    if (q.type === 'essay') {
      var stems = Array.isArray(q.stems) ? q.stems : (q.stems ? [q.stems] : []);
      return '<div class="ce-preview__item">' + head +
        (q.material ? '<div class="ce-callout">' + md(q.material) + '</div>' : '') +
        (stems.length ? '<ol class="ce-preview__list">' + stems.map(function (s) { return '<li>' + inline(s) + '</li>'; }).join('') + '</ol>' : '') +
        '<div class="ce-answer">' +
          '<h5 class="ce-answer__title">' + esc(L('fields.reference')) + '</h5>' + inlineOrEmpty(q.referenceAnswer) +
          (q.analysis ? '<h5 class="ce-answer__title">' + esc(L('fields.analysis')) + '</h5>' + md(q.analysis) : '') +
          (q.criteria && q.criteria.length ? '<h5 class="ce-answer__title">' + esc(L('fields.criteria')) + '</h5><ol>' +
            q.criteria.map(function (c) { return '<li>' + inline(c) + '</li>'; }).join('') + '</ol>' : '') +
        '</div></div>';
    }

    var answer = Array.isArray(q.answer) ? q.answer : [q.answer];
    return '<div class="ce-preview__item">' + head +
      (q.material ? '<div class="ce-callout">' + md(q.material) + '</div>' : '') +
      '<p class="ce-preview__stem">' + inline(q.stem || '') + '</p>' +
      '<div class="ce-preview__options">' + (q.options || []).map(function (opt) {
        var c = answer.indexOf(opt.key) >= 0 ? ' ce-preview__option--correct' : '';
        return '<div class="ce-preview__option' + c + '">' + esc(opt.key) + '. ' + inline(opt.text) + '</div>';
      }).join('') + '</div>' +
      '<div class="ce-answer">' +
        '<h5 class="ce-answer__title">' + esc(L('fields.answer')) + '：' + esc(answer.join('')) + '</h5>' +
        (q.analysis ? md(q.analysis) : '<p class="ce-preview__empty">' + esc(L('emptyValue')) + '</p>') +
        (q.knowledge && q.knowledge.items && q.knowledge.items.length
          ? '<h5 class="ce-answer__title">' + esc(q.knowledge.title || L('fields.notes')) + '</h5>' +
            '<ul>' + q.knowledge.items.map(function (t) { return '<li>' + inline(t) + '</li>'; }).join('') + '</ul>'
          : '') +
      '</div></div>';
  }

  function renderPreview() {
    var node = el('#preview');
    if (!node) return;
    var it = selectedItem();
    var no = 1, html = '';
    if (!it) {
      node.innerHTML = '<p class="ce-preview__empty">' + esc(L('selectionEmpty')) + '</p>';
      renderOutput();
      return;
    }
    if (it.kind === 'group') {
      var mod = (state.modules && state.modules[it.id]) || {};
      var qs = mod.questions || [];
      html = '<div class="ce-preview__group">' +
        '<h3 class="ce-preview__title">' + esc(mod.title || it.title) + '</h3>' +
        (mod.intro ? '<p>' + inline(mod.intro) + '</p>' : '') +
        (qs.length
          ? qs.map(function (q) { return previewItemHtml(q, no++); }).join('')
          : '<p class="ce-preview__empty">' + esc(L('groupEmpty')) + '</p>') +
        '</div>';
    } else {
      var pl = state.postLesson || {};
      html = (pl.sections || []).map(function (sec) {
        return '<div class="ce-preview__group">' +
          '<h3 class="ce-preview__title">' + esc(sec.title || '') + '</h3>' +
          (sec.questions || []).map(function (q) { return previewItemHtml(q, no++); }).join('') +
          '</div>';
      }).join('');
      if (!html) html = '<p class="ce-preview__empty">' + esc(L('auxiliaryEmpty')) + '</p>';
    }
    node.innerHTML = html;
    renderOutput();
  }

  /* ==========================================================
     十二、导出与校验
     ========================================================== */
  function generated() {
    var modules = {};
    Object.keys((state && state.modules) || {}).forEach(function (id) {
      var mod = state.modules[id];
      if (!mod || !mod.questions || !mod.questions.length) return;
      var out = {};
      if (mod.title) out.title = mod.title;
      if (mod.intro) out.intro = mod.intro;
      out.questions = mod.questions;
      modules[id] = out;
    });
    var payload = {
      version: state.version || 1,
      lesson: state.lesson || (manifest && manifest.lesson) || '',
      updatedAt: new Date().toISOString(),
      modules: modules
    };
    if (state.postLesson) payload.postLesson = state.postLesson;
    return '/* Generated by Content Editor */\n' +
      'window.' + SRC.exportGlobal + ' = ' + JSON.stringify(payload, null, 2) + ';\n';
  }
  function renderOutput() { var o = el('#output'); if (o) o.value = generated(); }

  /** 校验：返回结构化问题（含可定位的 base 与字段路径），供状态条与高亮共用 */
  function collectIssues() {
    var issues = [];
    function push(label, message, base, paths) {
      issues.push({ label: label, message: message, base: base, paths: paths || [] });
    }
    if (!manifest) {
      push('', L('validation.structureMissing'), '', []);
    }
    if (totalItems() === 0) {
      push('', L('validation.empty'), '', []);
    }

    function check(q, base, label) {
      if (q.type === 'essay') {
        var stems = (Array.isArray(q.stems) ? q.stems : [q.stems]).filter(function (s) { return s && String(s).trim(); });
        if (!stems.length) push(label, L('validation.missingField', { label: label, field: L('fields.stems') }), base, [base + '.stems']);
        if (!q.referenceAnswer) push(label, L('validation.missingField', { label: label, field: L('fields.reference') }), base, [base + '.referenceAnswer']);
        return;
      }
      if (!q.stem) push(label, L('validation.missingField', { label: label, field: L('fields.stem') }), base, [base + '.stem']);
      var optPaths = (q.options || []).map(function (o, i) { return base + '.options.' + i + '.text'; });
      var filled = (q.options || []).filter(function (o) { return o && String(o.text).trim(); });
      if (filled.length < 2) push(label, L('validation.tooFewOptions', { label: label, field: L('fields.options') }), base, optPaths);
      var keys = (q.options || []).map(function (o) { return o.key; });
      var answers = (Array.isArray(q.answer) ? q.answer : [q.answer]).filter(function (a) { return keys.indexOf(a) >= 0; });
      if (!answers.length) push(label, L('validation.invalidAnswer', { label: label, field: L('fields.answer') }), base, []);
    }

    Object.keys((state && state.modules) || {}).forEach(function (id) {
      var mod = state.modules[id];
      if (!mod) return;
      var it = findItem(id);
      var label = groupLabel(it) || id;
      (mod.questions || []).forEach(function (q, qi) {
        check(q, 'modules.' + id + '.questions.' + qi, label + ' #' + (qi + 1));
      });
    });
    var pl = state.postLesson;
    if (pl && pl.sections) {
      pl.sections.forEach(function (sec, si) {
        (sec.questions || []).forEach(function (q, qi) {
          check(q, 'postLesson.sections.' + si + '.questions.' + qi,
            (sec.title || L('sectionFallback')) + ' #' + (si + 1) + '-' + (qi + 1));
        });
      });
    }
    return issues;
  }

  /** 把问题标记到编辑区对应字段上 */
  function markInvalid(issues) {
    els('#editor .is-invalid').forEach(function (n) { n.classList.remove('is-invalid'); });
    els('#editor [aria-invalid="true"]').forEach(function (n) { n.removeAttribute('aria-invalid'); });
    els('#editor .ce-card--item[data-base]').forEach(function (card) {
      var base = card.getAttribute('data-base');
      var hit = issues.some(function (is) { return is.base === base; });
      card.classList.toggle('is-invalid', hit);
    });
    issues.forEach(function (is) {
      is.paths.forEach(function (p, idx) {
        var node = el('#editor [data-path="' + p + '"]');
        if (!node) return;
        node.classList.add('is-invalid');
        node.setAttribute('aria-invalid', 'true');
        if (idx === 0 && !node.id) node.id = 'inv-' + p.replace(/[^a-zA-Z0-9]/g, '-');
      });
    });
  }

  function renderValidation(issues) {
    issues = issues || collectIssues();
    var notes = navSummary();
    var node = el('#status-bar');
    var badge = el('#issue-badge');
    if (badge) {
      badge.textContent = String(issues.length);
      badge.hidden = issues.length === 0;
    }
    if (node) {
      var ok = issues.length === 0;
      var head = ok
        ? L('validation.summaryOk')
        : L('validation.summaryIssues', { n: issues.length }) + (issues[0] ? issues[0].message : '');
      node.innerHTML = esc(head) +
        (!ok && issues.some(function (i) { return i.base; })
          ? ' <button class="ce-linkbtn" type="button" data-act="locate-issue">' + esc(L('validation.locate')) + '</button>'
          : '') +
        (notes.length ? ' <span class="ce-field__hint">· ' + esc(notes.join('；')) + '</span>' : '');
      node.className = 'ce-status' + (ok ? (notes.length ? ' ce-status--warn' : ' ce-status--ok') : ' ce-status--error');
    }
    return issues;
  }

  function locateFirstIssue(issues) {
    var first = issues.filter(function (i) { return i.paths && i.paths.length; })[0];
    var target = first ? el('#editor [data-path="' + first.paths[0] + '"]')
      : (issues[0] && issues[0].base ? el('#editor .ce-card--item[data-base="' + issues[0].base + '"]') : null);
    if (target) {
      target.scrollIntoView({ block: 'center', behavior: 'smooth' });
      if (target.focus) target.focus({ preventScroll: true });
    }
  }

  /* ==========================================================
     十三、全量渲染
     ========================================================== */
  function renderAll() {
    ensureSelected();
    renderNav();
    renderEditor();          /* 可能惰性创建分组对象，故先渲染再统一校验 */
    var issues = collectIssues();
    markInvalid(issues);
    renderPreview();
    renderValidation(issues);
    renderGuide();
  }
  /** 仅输入时的轻量更新：不重建编辑区（避免失焦） */
  function renderOnInput() {
    var issues = collectIssues();
    markInvalid(issues);
    renderNav();
    renderPreview();
    renderValidation(issues);
    renderGuide();
  }

  /* ==========================================================
     十四、结构操作
     ========================================================== */
  function renumberOptions(q) {
    q.options.forEach(function (o, i) { o.key = String.fromCharCode(65 + i); });
  }

  function handleStruct(act, t) {
    var qbase = t.dataset.qbase, qi = Number(t.dataset.qi);
    var base = t.dataset.base, oi = Number(t.dataset.oi);
    var sbase = t.dataset.sbase, si = Number(t.dataset.si);
    var arr, q;
    switch (act) {
      case 'add-section':
        if (!state.postLesson) state.postLesson = { title: '', subtitle: '', sections: [] };
        if (!state.postLesson.sections) state.postLesson.sections = [];
        state.postLesson.sections.push({ id: 'part-' + (state.postLesson.sections.length + 1), title: '', questions: [] });
        break;
      case 'del-section':
        arr = getPath(state, sbase);
        if (!arr || arr.length <= 1) { toast(L('toast.keepOneSection'), 'warn'); return; }
        confirmDialog(L('dialog.removeSection'), function () {
          getPath(state, sbase).splice(si, 1);
          saveDraft(); renderAll();
        });
        return;
      case 'add-item':
        arr = getPath(state, qbase);
        if (arr) arr.push(newItem(t.dataset.kind));
        break;
      case 'del-item':
        arr = getPath(state, qbase);
        if (!arr) return;
        confirmDialog(L('dialog.removeItem'), function () {
          getPath(state, qbase).splice(qi, 1);
          saveDraft(); renderAll();
        });
        return;
      case 'dup-item':
        arr = getPath(state, qbase);
        if (arr) arr.splice(qi + 1, 0, clone(arr[qi]));
        break;
      case 'up-item':
        arr = getPath(state, qbase);
        if (arr && qi > 0) arr.splice(qi - 1, 0, arr.splice(qi, 1)[0]);
        break;
      case 'down-item':
        arr = getPath(state, qbase);
        if (arr && qi < arr.length - 1) arr.splice(qi + 1, 0, arr.splice(qi, 1)[0]);
        break;
      case 'add-option':
        q = getPath(state, base);
        if (q && q.options) q.options.push({ key: String.fromCharCode(65 + q.options.length), text: '' });
        break;
      case 'del-option':
        q = getPath(state, base);
        if (!q || !q.options) return;
        if (q.options.length <= 2) { toast(L('toast.keepTwoOptions'), 'warn'); return; }
        q.options.splice(oi, 1); renumberOptions(q);
        if (!Array.isArray(q.answer) && q.options.every(function (o) { return o.key !== q.answer; })) q.answer = q.options[0].key;
        break;
      default: return;
    }
    saveDraft(); renderAll();
  }

  function selectItem(id) {
    selectedId = id;
    var it = findItem(id);
    if (it && it.kind === 'group') ensureGroup(it);
    renderAll();
  }

  /* ==========================================================
     十五、富文本插入
     ========================================================== */
  function insertAt(textarea, text) {
    var start = textarea.selectionStart || 0, end = textarea.selectionEnd || 0;
    var value = textarea.value;
    textarea.value = value.slice(0, start) + text + value.slice(end);
    var pos = start + text.length;
    textarea.selectionStart = textarea.selectionEnd = pos;
    textarea.focus();
    textarea.dispatchEvent(new Event('input', { bubbles: true }));
  }

  function pickImage(textarea) {
    var input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*';
    input.onchange = function () {
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        insertAt(textarea, '![' + (file.name || L('imageNameFallback')) + '](' + reader.result + ')\n');
        toast(L('toast.imageInlined'), 'ok');
      };
      reader.readAsDataURL(file);
    };
    input.click();
  }

  function clampInt(raw, min, max, fallback) {
    var n = parseInt(raw, 10);
    if (isNaN(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  function buildTable(cols, rows) {
    var head = [], sep = [], body = [];
    for (var c = 0; c < cols; c++) { head.push('H' + (c + 1)); sep.push('---'); }
    for (var r = 0; r < rows; r++) {
      var row = [];
      for (var k = 0; k < cols; k++) row.push('');
      body.push('| ' + row.join(' | ') + ' |');
    }
    return '\n| ' + head.join(' | ') + ' |\n| ' + sep.join(' | ') + ' |\n' +
      (body.length ? body.join('\n') + '\n' : '');
  }

  function pickTable(textarea) {
    openDialog({
      title: L('dialog.tableTitle'),
      body: '<div class="ce-dialog__grid">' +
        '<label class="ce-field"><span class="ce-field__label">' + esc(L('dialog.tableCols')) + '</span>' +
        '<input class="ce-input" type="number" min="1" max="8" value="3" data-autofocus id="dlg-cols"></label>' +
        '<label class="ce-field"><span class="ce-field__label">' + esc(L('dialog.tableRows')) + '</span>' +
        '<input class="ce-input" type="number" min="0" max="50" value="3" id="dlg-rows"></label>' +
        '</div>',
      confirmText: L('dialog.tableInsert'),
      onConfirm: function () {
        var cols = clampInt(el('#dlg-cols').value, 1, 8, 3);
        var rows = clampInt(el('#dlg-rows').value, 0, 50, 3);
        insertAt(textarea, buildTable(cols, rows));
      }
    });
  }

  /* ==========================================================
     十六、导入 / 导出 / 就近读写
     ========================================================== */
  function download() {
    var blob = new Blob([generated()], { type: 'text/javascript;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = SRC.exportFile;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast(L('toast.exported', { name: SRC.exportFile }), 'ok');
  }

  function fallbackCopy(text) {
    var ta = el('#output');
    ta.value = text; ta.select();
    try { document.execCommand('copy'); toast(L('toast.copied'), 'ok'); }
    catch (e) { toast(L('toast.copyManual'), 'warn'); }
  }
  function copyOut() {
    var text = generated();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(L('toast.copied'), 'ok'); },
        function () { fallbackCopy(text); });
    } else { fallbackCopy(text); }
  }

  function importDataFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var raw = String(reader.result);
        var m = raw.match(/\{[\s\S]*\}/);
        var parsed = JSON.parse(m ? m[0] : raw);
        if (adopt(parsed)) { saveDraft(); ensureSelected(); renderAll(); toast(L('toast.imported'), 'ok'); }
        else throw new Error(L('toast.unparsable'));
      } catch (err) { toast(L('toast.importFailed', { msg: err.message }), 'error'); }
    };
    reader.readAsText(file);
  }

  function adopt(data) {
    if (!data || typeof data !== 'object') return false;
    if (data.modules || data.postLesson) {
      state = {
        version: data.version || 1,
        lesson: data.lesson || (manifest && manifest.lesson) || '',
        updatedAt: data.updatedAt || '',
        modules: data.modules ? clone(data.modules) : {},
        postLesson: data.postLesson ? clone(data.postLesson)
          : { title: L('auxiliaryFallback'), subtitle: '', sections: [] }
      };
      return true;
    }
    if (data.sections) {
      state = emptyState();
      state.postLesson = { title: data.title || L('auxiliaryFallback'), subtitle: data.subtitle || '', sections: data.sections };
      return true;
    }
    return false;
  }

  function loadScript(src) {
    return new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = function () { if (s.parentNode) s.parentNode.removeChild(s); resolve(true); };
      s.onerror = function () { resolve(false); };
      document.head.appendChild(s);
    });
  }

  function loadStructure() {
    if (window[SRC.structureGlobal]) return Promise.resolve(window[SRC.structureGlobal]);
    return loadScript(SRC.structureFile).then(function () { return window[SRC.structureGlobal] || null; });
  }
  function loadContent() {
    if (window[SRC.dataGlobal]) return Promise.resolve(window[SRC.dataGlobal]);
    return loadScript(SRC.dataFile).then(function () { return window[SRC.dataGlobal] || null; });
  }

  /** 结构清单缺失时的回退：用配置中的选择器从结构页面现场抽取 */
  function extractStructureFromDoc(doc) {
    var modules = [], auxiliary = null;
    var sections = doc.querySelectorAll(EXT.section);
    Array.prototype.forEach.call(sections, function (sec) {
      var id = sec.id || '';
      if (!id) return;
      var noEl = EXT.num ? sec.querySelector(EXT.num) : null;
      var titleEl = EXT.title ? sec.querySelector(EXT.title) : null;
      var btn = EXT.practiceBtn ? sec.querySelector(EXT.practiceBtn) : null;
      var clean = function (node) { return node ? node.textContent.replace(/\s+/g, ' ').trim() : ''; };
      var no = clean(noEl), title = clean(titleEl);
      var nav = EXT.navAttr ? (sec.getAttribute(EXT.navAttr) || '') : '';
      if (!btn) { auxiliary = { id: id, no: no, nav: nav, title: title }; return; }
      modules.push({
        key: (EXT.practiceKeyAttr && btn.getAttribute(EXT.practiceKeyAttr)) || '',
        id: id, no: no, nav: nav, title: title, practice: true,
        kind: (EXT.practiceKindAttr && btn.getAttribute(EXT.practiceKindAttr)) || 'choice'
      });
    });
    return {
      contract: 'structure-manifest', version: 1, lesson: '', title: doc.title || '',
      generatedAt: new Date().toISOString(), modules: modules, postLesson: auxiliary
    };
  }

  function loadStructureFromFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var doc = new DOMParser().parseFromString(String(reader.result), 'text/html');
        var m = extractStructureFromDoc(doc);
        if (!m.modules.length && !m.postLesson) throw new Error('no sections matched');
        applyManifest(m);
        toast(L('toast.structureLoaded', { n: m.modules.length }), 'ok');
      } catch (err) { toast(L('toast.structureFailed', { msg: err.message }), 'error'); }
    };
    reader.readAsText(file);
  }

  function applyManifest(m) {
    if (!m) return false;
    manifest = m;
    if (!state) state = emptyState();
    state.lesson = state.lesson || manifest.lesson || '';
    if (!state.postLesson) state.postLesson = emptyState().postLesson;
    ensureSelected();
    renderAll();
    return true;
  }

  function saveToFile() {
    var btn = el('[data-act="save-local"]');
    var text = generated();
    if (!window.showSaveFilePicker) { download(); return; }
    setBusy(btn, true);
    window.showSaveFilePicker({
      suggestedName: SRC.exportFile,
      types: [{ description: 'JavaScript', accept: { 'text/javascript': ['.js'] } }]
    }).then(function (handle) {
      return handle.createWritable().then(function (w) {
        return w.write(text).then(function () { return w.close(); });
      });
    }).then(function () {
      setBusy(btn, false);
      toast(L('toast.saved'), 'ok');
    }).catch(function (err) {
      setBusy(btn, false);
      if (err && err.name === 'AbortError') return;
      toast(L('toast.saveFallback'), 'warn');
      download();
    });
  }

  /* ==========================================================
     十七、主题 / 布局
     ========================================================== */
  var mql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  function resolvedTheme() {
    if (CFG.theme === 'light' || CFG.theme === 'dark') return CFG.theme;
    return (mql && mql.matches) ? 'dark' : 'light';
  }
  function applyTheme() {
    document.body.setAttribute('data-theme', resolvedTheme());
  }
  function toggleTheme() {
    var next = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    CFG.theme = next;
    storeSet(THEME_KEY, next);
    applyTheme();
  }

  function loadPrefs() {
    var rawTheme = storeGet(THEME_KEY);
    if (rawTheme === 'light' || rawTheme === 'dark') CFG.theme = rawTheme;
    var rawLayout = storeGet(LAYOUT_KEY);
    if (rawLayout) {
      try {
        var saved = JSON.parse(rawLayout);
        if (saved && typeof saved.nav === 'boolean') CFG.layout.nav = saved.nav;
        if (saved && typeof saved.preview === 'boolean') CFG.layout.preview = saved.preview;
      } catch (e) { /* 忽略 */ }
    }
    guideDismissed = storeGet(GUIDE_KEY) === '1';
  }
  function saveLayoutPref() {
    storeSet(LAYOUT_KEY, JSON.stringify({ nav: CFG.layout.nav, preview: CFG.layout.preview }));
  }
  function applyLayout() {
    var b = document.body;
    b.setAttribute('data-density', CFG.density);
    b.setAttribute('data-nav', CFG.layout.nav ? 'on' : 'off');
    b.setAttribute('data-preview', CFG.layout.preview ? 'on' : 'off');
    b.setAttribute('data-preview-placement', CFG.layout.previewPlacement);
    if (CFG.layout.previewCollapsible && CFG.layout.preview) {
      b.setAttribute('data-preview-collapsed', collapsed.preview ? 'on' : 'off');
    } else {
      b.removeAttribute('data-preview-collapsed');
    }
    var btn = el('#preview-collapse-btn');
    if (btn) {
      btn.hidden = !(CFG.layout.previewCollapsible && CFG.layout.preview);
      btn.textContent = collapsed.preview ? L('previewExpand') : L('previewCollapse');
    }
    els('#panel-toggles .ce-segment__btn').forEach(function (b2) {
      var key = b2.dataset.panel;
      b2.setAttribute('aria-pressed', String(!!CFG.layout[key]));
    });
  }

  /* ==========================================================
     十八、顶栏 / 工具条静态结构渲染
     ========================================================== */
  function renderHeaderActions() {
    var node = el('#header-actions');
    if (!node) return;
    var a = CFG.labels.actions;
    node.innerHTML =
      '<div class="ce-actiongroup">' +
        '<button class="ce-btn ce-btn--sm" type="button" data-act="validate">' +
          esc(a.validate) + '<span class="ce-badge" id="issue-badge" hidden>0</span>' +
        '</button>' +
        '<div class="ce-menu">' +
          '<button class="ce-btn ce-btn--sm" type="button" data-act="toggle-menu" aria-haspopup="true" aria-expanded="false" title="' + attr(a.more) + '">' +
            esc(a.moreShort) +
            '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>' +
          '</button>' +
          '<div class="ce-menu__panel" id="more-menu" hidden>' +
            '<button class="ce-menu__item" type="button" data-act="import-structure">' + esc(a.importStructure) + '</button>' +
            '<button class="ce-menu__item" type="button" data-act="import-data">' + esc(a.importData) + '</button>' +
            '<button class="ce-menu__item" type="button" data-act="load-local">' + esc(a.loadLocal) + '</button>' +
            '<button class="ce-menu__item" type="button" data-act="copy">' + esc(a.copy) + '</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<span class="ce-header__divider" aria-hidden="true"></span>' +
      '<div class="ce-actiongroup">' +
        '<button class="ce-btn ce-btn--sm" type="button" data-act="export">' + esc(a.export) + '</button>' +
        '<button class="ce-btn ce-btn--sm ce-btn--primary" type="button" data-act="save-local">' + esc(a.saveLocal) + '</button>' +
      '</div>';
  }

  function renderChrome() {
    document.title = L('appTitle');
    var t = el('#app-title'); if (t) t.textContent = L('appTitle');
    var n = el('#nav-title'); if (n) n.textContent = L('navTitle');
    var e = el('#editor-title'); if (e) e.textContent = L('editorTitle');
    var p = el('#preview-title'); if (p) p.textContent = L('previewTitle');
    var s = el('#output-summary'); if (s) s.textContent = L('outputSummary');
    var g = el('#guide-btn'); if (g) g.title = L('guide.reopen');

    var toggles = el('#panel-toggles');
    if (toggles) {
      if (CFG.layout.allowPanelToggle) {
        toggles.className = 'ce-toolbar__group ce-segment';
        toggles.innerHTML = ['nav', 'preview'].map(function (key) {
          var label = key === 'nav' ? L('navTitle') : L('previewTitle');
          return '<button class="ce-segment__btn" type="button" data-panel="' + key + '" aria-pressed="true">' + esc(label) + '</button>';
        }).join('');
      } else {
        toggles.className = 'ce-toolbar__group';
        toggles.innerHTML = '';
      }
    }

    var sf = el('#structure-file');
    if (sf) sf.accept = (SRC.acceptStructureExt || []).join(',');
    var df = el('#data-file');
    if (df) df.accept = (SRC.acceptDataExt || []).join(',');
  }

  /* ==========================================================
     十九、事件绑定
     ========================================================== */
  function guideAddTarget() {
    var it = selectedItem();
    if (!it) return null;
    if (it.kind === 'auxiliary') {
      if (!state.postLesson) state.postLesson = { title: '', subtitle: '', sections: [] };
      if (!state.postLesson.sections || !state.postLesson.sections.length) {
        state.postLesson.sections = [{ id: 'part-1', title: '', questions: [] }];
      }
      return 'postLesson.sections.0.questions';
    }
    ensureGroup(it);
    return 'modules.' + it.id + '.questions';
  }

  function bindGlobal() {
    /* 输入：按 path 写回状态 */
    document.addEventListener('input', function (e) {
      var t = e.target;
      if (!(t.matches && t.matches('[data-path]'))) return;
      var path = t.dataset.path;
      if (/\.criteria$/.test(path) || /\.stems$/.test(path) || /\.knowledge\.items$/.test(path)) {
        setPath(state, path, t.value.split('\n'));
      } else {
        setPath(state, path, t.value);
      }
      saveDraft(); renderOnInput();
    });

    document.addEventListener('change', function (e) {
      var t = e.target;
      if (t.matches && t.matches('[data-answer]')) {
        var path = t.dataset.answer;
        if (t.dataset.multi === 'true') {
          var checked = els('[data-answer="' + path + '"]')
            .filter(function (i) { return i.checked; })
            .map(function (i) { return i.value; });
          setPath(state, path, checked);
        } else {
          setPath(state, path, t.value);
        }
        saveDraft(); renderPreview(); renderValidation(); renderGuide(); return;
      }
      if (t.matches && t.matches('[data-mode-path]')) {
        var q = getPath(state, t.dataset.modePath.replace(/\.mode$/, ''));
        if (q) {
          q.mode = t.value;
          if (t.value === 'single') q.answer = Array.isArray(q.answer) ? (q.answer[0] || 'A') : q.answer;
        }
        saveDraft(); renderEditor(); renderValidation(); renderPreview(); renderGuide(); return;
      }
      if (t.id === 'structure-file' && t.files && t.files[0]) { loadStructureFromFile(t.files[0]); t.value = ''; return; }
      if (t.id === 'data-file' && t.files && t.files[0]) { importDataFile(t.files[0]); t.value = ''; }
    });

    document.addEventListener('click', function (e) {
      var pick = e.target.closest ? e.target.closest('[data-select]') : null;
      if (pick) { closeMenu(); selectItem(pick.dataset.select); return; }

      var panelBtn = e.target.closest ? e.target.closest('[data-panel]') : null;
      if (panelBtn) {
        var key = panelBtn.dataset.panel;
        CFG.layout[key] = !CFG.layout[key];
        saveLayoutPref(); applyLayout();
        return;
      }

      /* 对话框动作（含遮罩点击）：不限于 button 元素 */
      var actEl = e.target.closest ? e.target.closest('[data-act]') : null;
      if (actEl) {
        var dashAct = actEl.dataset.act;
        if (dashAct === 'dialog-cancel') { closeDialog(); return; }
        if (dashAct === 'dialog-confirm') {
          var fn = dialogState.onConfirm;
          var keep = fn ? fn() : undefined;
          if (keep !== false) closeDialog();
          return;
        }
      }

      var t = e.target.closest ? e.target.closest('button') : null;
      if (!t) { if (!(e.target.closest && e.target.closest('.ce-menu'))) closeMenu(); return; }

      if (t.hasAttribute('data-insert-image')) {
        var f = t.closest('.ce-field');
        var ta = f && f.querySelector('textarea');
        if (ta) pickImage(ta);
        return;
      }
      if (t.hasAttribute('data-insert-table')) {
        var f2 = t.closest('.ce-field');
        var ta2 = f2 && f2.querySelector('textarea');
        if (ta2) pickTable(ta2);
        return;
      }

      var act = t.dataset.act;
      if (!act) return;

      switch (act) {
        case 'validate': {
          closeMenu();
          var issues = collectIssues();
          if (issues.length) {
            markInvalid(issues);
            toast(L('toast.validated', { n: issues.length, locate: L('validation.locate') }), 'warn');
          } else {
            toast(L('toast.validateOk'), 'ok');
          }
          renderValidation(); renderGuide();
          return;
        }
        case 'locate-issue': locateFirstIssue(collectIssues()); return;
        case 'export': closeMenu(); download(); return;
        case 'copy': closeMenu(); copyOut(); return;
        case 'save-local': closeMenu(); saveToFile(); return;
        case 'import-structure': closeMenu(); { var sf = el('#structure-file'); if (sf) sf.click(); } return;
        case 'import-data': closeMenu(); { var df = el('#data-file'); if (df) df.click(); } return;
        case 'load-local':
          closeMenu();
          loadContent().then(function (data) {
            if (adopt(data)) { ensureSelected(); renderAll(); toast(L('toast.localLoaded'), 'ok'); }
            else toast(L('toast.localMissing'), 'warn');
          });
          return;
        case 'toggle-menu': toggleMenu(); return;
        case 'toggle-theme': toggleTheme(); return;
        case 'collapse-preview': collapsed.preview = !collapsed.preview; applyLayout(); return;
        case 'dismiss-guide':
          guideDismissed = true; guideForced = false;
          storeSet(GUIDE_KEY, '1'); renderGuide(); return;
        case 'show-guide':
          guideDismissed = false; guideForced = true;
          storeSet(GUIDE_KEY, ''); renderGuide(); return;
        case 'guide-select': {
          var first = navItems()[0];
          if (first) selectItem(first.id);
          return;
        }
        case 'guide-add': {
          var target = guideAddTarget();
          if (!target) return;
          var kinds = CFG.schema.itemKinds || [];
          var arr = getPath(state, target);
          if (arr) arr.push(newItem(kinds[0] || 'choice'));
          saveDraft(); renderAll();
          return;
        }
        default: handleStruct(act, t);
      }
    });

    document.addEventListener('mousedown', function (e) {
      if (!(e.target.closest && e.target.closest('.ce-menu'))) closeMenu();
    });

    document.addEventListener('keydown', function (e) {
      trapFocus(e);
      if (e.key === 'Escape') {
        closeMenu();
        var dlg = el('#dialog');
        if (dlg && !dlg.hidden) { e.preventDefault(); closeDialog(); }
      }
    });

    /* 结构文件拖放（可配置关闭） */
    if (CFG.layout.acceptStructureDrop) {
      var nav = el('.ce-panel--nav');
      if (nav) {
        nav.addEventListener('dragover', function (e) { e.preventDefault(); nav.classList.add('is-dragover'); });
        nav.addEventListener('dragleave', function () { nav.classList.remove('is-dragover'); });
        nav.addEventListener('drop', function (e) {
          e.preventDefault(); nav.classList.remove('is-dragover');
          var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          if (f) loadStructureFromFile(f);
        });
      }
    }

    if (mql) {
      var onScheme = function () { if (CFG.theme === 'auto') applyTheme(); };
      if (mql.addEventListener) mql.addEventListener('change', onScheme);
      else if (mql.addListener) mql.addListener(onScheme);
    }
  }

  /* ==========================================================
     二十、启动
     ========================================================== */
  function init() {
    loadPrefs();
    applyTheme();

    state = emptyState();
    var hadDraft = loadDraft();

    renderChrome();
    renderHeaderActions();
    applyLayout();
    bindGlobal();
    renderAll();

    loadStructure().then(function (m) {
      if (m) manifest = m;
      if (manifest) {
        state.lesson = state.lesson || manifest.lesson || '';
        if (!state.postLesson) state.postLesson = emptyState().postLesson;
      }
      renderAll();
      return loadContent();
    }).then(function (data) {
      if (hadDraft) {
        if (data) toast(L('toast.draftLoaded', { label: L('actions.loadLocal') }));
        return;
      }
      if (adopt(data)) { ensureSelected(); renderAll(); toast(L('toast.localLoaded'), 'ok'); }
    }).catch(function (err) {
      if (window.console) console.error('[内容编辑器] 初始化失败', err);
    });
  }

  init();
})();
</script>
</body>
</html>
