<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>航天发射相关问题 · 高三一轮复习</title>
</head>
<body>
  <header class="nav" id="nav"></header>

  <main class="deck" id="deck">
    <section class="screen intro" id="m1">
      <!-- 封面实景背景：放在入口 HTML 中由 Vite 重写为相对 index.html 的路径，
           单文件构建（file:// 双击打开）时同样可用 -->
      <div class="intro__bg">
        <img src="./assets/images/cover-bg.png" alt="" aria-hidden="true" decoding="async" />
      </div>
    </section>
    <section class="screen" id="m4"></section>
    <section class="screen" id="m2"></section>
    <section class="screen" id="m3"></section>
    <section class="screen" id="m5"></section>
    <section class="screen" id="m6"></section>
    <section class="screen" id="m7"></section>
    <!-- M7 答题屏：常驻在综合题训练下方，滚动或点「进入答题」均可到达 -->
    <section class="screen" id="m7a"></section>
    <section class="screen" id="m8"></section>
  </main>

  <div class="toast-host" id="toastHost" aria-live="polite"></div>
  <div class="overlay-host" id="overlayHost"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
